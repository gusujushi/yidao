<title>易道能力岛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局概念：明亮的海图。五片海各有颜色，岛屿像游戏关卡；卦象按五行上色（金木水火土）；吉祥物“易宝”是一个会眨眼的太极。 */
:root{
  --bg:#EAF4FB; --card:#FFFFFF; --ink:#18263A; --muted:#5E6E82; --line:#D5E2EE;
  --sky:#CDEBF7; --sea:#8FD3E0; --sea2:#5BB8CE; --sand:#F7D98B;
  --s1:#14A3B8; --s2:#2EAD66; --s3:#8A63E0; --s4:#2F7FF0; --s5:#F07F1E;
  --jin:#D99A00; --mu:#22A060; --shui:#2D7FF9; --huo:#E5484D; --tu:#B0702A;
  --seal:#E5484D; --gold:#F5B82E; --good:#22A060; --bad:#E5484D;
  --f-brush:"Ma Shan Zheng","STXingkai","KaiTi","Kaiti SC",serif;
  --f-fun:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","SimSun","STSong",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1726;--card:#172338;--ink:#E8EEF6;--muted:#9AABC0;--line:#27364E;
  --sky:#13253A;--sea:#16405A;--sea2:#1E5877;--sand:#8A7440;
  --s1:#3CC4D8;--s2:#4CCB84;--s3:#A88BF0;--s4:#5C9DFF;--s5:#FF9D4D;
  --jin:#F2B92E;--mu:#45C483;--shui:#5C9DFF;--huo:#FF6B6F;--tu:#D99652;--seal:#FF6B6F;--gold:#F7C64A;--good:#45C483;--bad:#FF6B6F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1726;--card:#172338;--ink:#E8EEF6;--muted:#9AABC0;--line:#27364E;
  --sky:#13253A;--sea:#16405A;--sea2:#1E5877;--sand:#8A7440;
  --s1:#3CC4D8;--s2:#4CCB84;--s3:#A88BF0;--s4:#5C9DFF;--s5:#FF9D4D;
  --jin:#F2B92E;--mu:#45C483;--shui:#5C9DFF;--huo:#FF6B6F;--tu:#D99652;--seal:#FF6B6F;--gold:#F7C64A;--good:#45C483;--bad:#FF6B6F;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:16px;line-height:1.75;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--s4);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.fun{font-family:var(--f-fun);font-weight:400}
.brush{font-family:var(--f-brush);font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* 顶栏 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:0 2px 0 var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo b{font-family:var(--f-brush);font-size:30px;font-weight:400;background:linear-gradient(90deg,var(--s1),var(--s3) 50%,var(--s5));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;align-items:center;gap:10px;font-size:13px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.lv{background:color-mix(in srgb,var(--s3) 16%,var(--card));color:var(--s3)}
.chip.xp{background:color-mix(in srgb,var(--gold) 20%,var(--card));color:color-mix(in srgb,var(--gold) 60%,var(--ink))}
.chip.fire{background:color-mix(in srgb,var(--s5) 16%,var(--card));color:var(--s5)}
.chip.snd{border:0;background:color-mix(in srgb,var(--s4) 12%,var(--card));color:var(--s4)}
.xpbar{width:80px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--s5))}
nav.tabs{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
nav.tabs button{border:0;border-radius:999px;padding:5px 14px;font-size:14px;white-space:nowrap;background:transparent;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--ink);color:var(--card)}
nav.tabs button:hover:not(.on){background:var(--line)}

/* 通用 */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--s4);color:#fff;padding:10px 22px;border-radius:999px;font-size:15px;font-weight:700;box-shadow:0 4px 0 color-mix(in srgb,var(--s4) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--s4) 60%,#000)}
.btn.go{background:var(--s2);box-shadow:0 4px 0 color-mix(in srgb,var(--s2) 60%,#000)}
.btn.warm{background:var(--s5);box-shadow:0 4px 0 color-mix(in srgb,var(--s5) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.small{padding:5px 14px;font-size:13px;box-shadow:0 0 0 2px var(--line) inset;background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:0 2px 0 var(--line);scroll-margin-top:140px}
section.view{display:grid;gap:22px;padding-top:22px}
.head2{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
.head2 h2{font-size:30px}

/* 易宝 */
.mascot{flex:none}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
.mascot.happy{animation:hop .6s ease-out}
.mascot.sad{animation:wob .5s ease-out}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-8deg)}100%{transform:translateY(0)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.bubble{position:relative;background:var(--card);border-radius:14px;padding:8px 14px;box-shadow:0 0 0 2px var(--line) inset;font-size:14px;min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.talk{display:flex;gap:12px;align-items:flex-start}

/* 首页 */
.today{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.hero{background:linear-gradient(135deg,var(--s1),var(--s4));color:#fff;border-radius:var(--r);padding:20px 22px;display:grid;gap:8px;position:relative;overflow:hidden}
.hero .eyebrow{color:#ffffffcc}
.hero .big{font-family:var(--f-brush);font-size:48px;line-height:1.1}
.hero ul{margin:2px 0 8px;padding-left:1.2em;font-size:14px}
.hero .btn{background:#fff;color:var(--s4);box-shadow:0 4px 0 #0003}
.hero .note{color:#ffffffd0}
.hero::after{content:"☯";position:absolute;right:-20px;bottom:-50px;font-size:180px;opacity:.12;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border-radius:14px;padding:12px 14px;display:grid;gap:2px;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--ink)}
.tile b{font-family:var(--f-fun);font-size:28px;font-weight:400;color:var(--c);font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;border-radius:12px;padding:6px 12px 6px 6px;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;font-size:13px}
.badge i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-fun);color:#fff;background:var(--c);font-size:15px}
.badge.off{opacity:.45;filter:grayscale(1)}
.map{border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--sky),var(--sea) 18%,var(--sea2));box-shadow:0 2px 0 var(--line)}
.map svg{display:block;width:100%;height:auto}
.isle{cursor:pointer}
.isle .rim{fill:var(--sand)}
.isle .land{stroke:#ffffff;stroke-width:3}
.isle.lock{cursor:not-allowed}
.isle.lock .land{fill:#9FB2C2 !important}
.isle.lock .rim{fill:#C9D5DF}
.isle.lock .tree{fill:#B9C7D2}
.isle:hover:not(.lock) .grp{transform:translateY(-4px)}
.isle .grp{transition:transform .15s;transform-box:fill-box}
.isle:focus-visible .land{stroke:var(--gold);stroke-width:6}
.isle text{font-family:var(--f-fun)}
.boat{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.wave{fill:none;stroke:#ffffff;opacity:.45;stroke-width:3;stroke-linecap:round;animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.path{stroke:#ffffff;stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round;fill:none;opacity:.8}

/* 课程 */
.dayhead{border-radius:var(--r);padding:16px 20px;background:linear-gradient(120deg,var(--sc),color-mix(in srgb,var(--sc) 55%,var(--s4)));color:#fff;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.dayhead .eyebrow{color:#ffffffd0}
.dayhead h2{font-family:var(--f-brush);font-weight:400;font-size:32px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:0;background:#ffffff33;color:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700}
.steps button.on{background:#fff;color:var(--sc)}
.steps button.seen:not(.on)::before{content:"✓ "}
.page{background:var(--card);border-radius:var(--r);padding:0 0 20px;display:grid;gap:16px;box-shadow:0 2px 0 var(--line);overflow:hidden}
.page>*:not(.ph){margin:0 clamp(16px,4vw,32px)}
.ph{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:14px clamp(16px,4vw,32px);background:color-mix(in srgb,var(--pc) 14%,var(--card));border-bottom:3px solid var(--pc)}
.ph h3{font-family:var(--f-fun);font-weight:400;font-size:26px;color:var(--ink)}
.ph .tag{background:var(--pc);color:#fff;border-radius:8px;padding:1px 10px;font-size:13px;font-weight:700}
.yw{font-family:var(--f-serif);font-size:20px;line-height:2.1;letter-spacing:.04em;max-width:40em}
.yw .c{cursor:pointer;border-radius:3px}
.yw .c.h{color:transparent;background:color-mix(in srgb,var(--gold) 35%,var(--card));user-select:none}
.key{border-radius:12px;padding:10px 14px;font-family:var(--f-serif);font-weight:600;max-width:42em;background:color-mix(in srgb,var(--gold) 18%,var(--card))}
.bh{max-width:44em}
.lab{font-size:13px;font-weight:700;margin-bottom:2px;color:var(--lc,var(--s4))}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.case{border-radius:12px;padding:12px 14px;min-width:0;background:color-mix(in srgb,var(--lc) 9%,var(--card))}
.case.gu{--lc:var(--tu)} .case.jin{--lc:var(--s4)}
.yong{font-size:14px;background:color-mix(in srgb,var(--s2) 14%,var(--card));padding:10px 14px;border-radius:12px;display:flex;gap:8px;align-items:center}
.yong::before{content:"行";flex:none;width:26px;height:26px;border-radius:50%;background:var(--s2);color:#fff;display:grid;place-items:center;font-family:var(--f-fun)}
.tools{display:flex;gap:6px;margin-left:auto}
.gtop{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hexa{flex:none}
.trilegend{display:grid;gap:4px;font-size:13px}
.trilegend span{display:inline-flex;align-items:center;gap:6px}
.trilegend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.yao{display:grid;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.yao>div{display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(0,1fr);gap:4px 14px;padding:8px 12px;align-items:center}
.yao>div:nth-child(odd){background:color-mix(in srgb,var(--line) 35%,var(--card))}
.yao .bar{width:34px;height:8px;border-radius:2px;background:var(--c)}
.yao .bar.yin{background:linear-gradient(90deg,var(--c) 0 42%,transparent 42% 58%,var(--c) 58%)}
.yao .p{font-weight:700}
.yao .t{font-family:var(--f-serif)}
.yao .w{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-size:14px;color:var(--s4);font-weight:700}

/* 对读 */
.bookwrap{overflow-x:auto;background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 2px 0 var(--line)}
.book{writing-mode:vertical-rl;height:24em;font-family:var(--f-serif);font-size:19px;line-height:2.3em;letter-spacing:.06em;padding:0 .2em;
  background-image:repeating-linear-gradient(to left,var(--line) 0 1px,transparent 1px 2.3em);border-left:4px double var(--s3);border-right:4px double var(--s3);margin-left:auto;width:max-content}
.book p{margin:0}
.book .hd{font-weight:900;color:var(--s3)}
.book .q1{color:var(--s2)} .book .q2{color:var(--s5)}
.book .an{text-indent:2em}
.book.h{writing-mode:horizontal-tb;height:auto;width:auto;max-width:44em;background:none;border:0;line-height:2}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.vs .side{border-radius:14px;padding:10px 16px;color:#fff;text-align:center;min-width:0}
.vs .x{font-family:var(--f-fun);font-size:28px;color:var(--s3)}

/* 测验 */
.quiz{max-width:740px;width:100%;margin:0 auto;display:grid;gap:16px}
.qtop{display:flex;align-items:center;gap:12px}
.qbar{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.qbar>div{height:100%;background:linear-gradient(90deg,var(--s2),var(--s1));border-radius:7px;transition:width .3s}
.combo{font-family:var(--f-fun);font-size:18px;color:var(--s5);min-width:5em;text-align:right}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.4)}}
.qcard{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:0 2px 0 var(--line);display:grid;gap:14px;position:relative}
.qq{font-size:20px;line-height:1.7;font-weight:500}
.qsub{background:color-mix(in srgb,var(--s4) 7%,var(--card));border-radius:12px;padding:12px 14px;font-size:15px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);display:flex;gap:10px;align-items:center}
.opt b{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--oc);font-family:var(--f-fun);font-weight:400}
.opt:hover:not(:disabled){box-shadow:0 0 0 2px var(--oc) inset,0 3px 0 var(--oc)}
.opt.ok{box-shadow:0 0 0 3px var(--good) inset;background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.no{box-shadow:0 0 0 3px var(--bad) inset;background:color-mix(in srgb,var(--bad) 12%,var(--card));animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{font-size:15px;border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--c) 13%,var(--card))}
.fb b{color:var(--c)}
.plus{position:absolute;right:20px;top:10px;font-family:var(--f-fun);font-size:26px;color:var(--gold);pointer-events:none;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.seals{display:flex;gap:12px}
.star{width:60px;height:60px}
.star path{fill:var(--line)}
.star.on path{fill:var(--gold)}
.star.on{animation:stamp .45s ease-out both}
@keyframes stamp{from{transform:scale(2) rotate(-30deg);opacity:0}to{transform:scale(1);opacity:1}}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.jn{width:150px;border-radius:12px;padding:10px;color:#fff;font-size:13px;text-align:left;background:var(--c);animation:flip .5s ease-out both}
.jn b{font-family:var(--f-fun);font-weight:400;font-size:16px;display:block}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 经典库 等 */
.grid-n{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.grid-n button{border:0;background:var(--card);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:13px;min-width:0;box-shadow:0 0 0 2px var(--line) inset}
.grid-n button b{font-family:var(--f-fun);font-weight:400;font-size:18px;color:var(--c,var(--muted))}
.grid-n button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.grid-n button.learned{background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:0 0 0 2px var(--c) inset}
.search{border:0;box-shadow:0 0 0 2px var(--line) inset;background:var(--card);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;color:var(--ink);min-width:0;flex:1 1 200px}
.seg{display:flex;gap:6px}
.seg button{border:0;border-radius:999px;padding:6px 16px;font-weight:700;background:var(--card);box-shadow:0 0 0 2px var(--line) inset}
.seg button.on{background:var(--ink);color:var(--card);box-shadow:none}
.tri{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tri>div{border-radius:14px;padding:10px;display:grid;justify-items:center;gap:2px;text-align:center;background:color-mix(in srgb,var(--c) 12%,var(--card))}
.tri b{font-family:var(--f-fun);font-weight:400;font-size:22px;color:var(--c)}
.basics{display:grid;gap:14px}
table.t{border-collapse:collapse;font-size:15px}
table.t td,table.t th{border-bottom:2px solid var(--line);padding:6px 10px;text-align:left}
.tablewrap{overflow-x:auto}
textarea{width:100%;min-height:80px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:0;box-shadow:0 0 0 2px var(--line) inset;border-radius:10px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 18px;border-radius:999px;font-size:14px;z-index:40;font-weight:700}
.code-in{font-family:var(--f-fun);font-size:30px;letter-spacing:.3em;width:7em;text-align:center;border:0;box-shadow:0 0 0 3px var(--s3) inset;border-radius:12px;background:var(--card);color:var(--ink);padding:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
@media (max-width:760px){
  .today,.cases,.two{grid-template-columns:1fr}
  .tri{grid-template-columns:repeat(2,1fr)}
  .yao>div{grid-template-columns:auto minmax(0,1fr)}
  .yao .w{grid-column:2}
  .stats{margin-left:0}
  .xpbar{width:50px}
  .head2 h2{font-size:26px}
  .yw{font-size:18px}
  .hero .big{font-size:40px}
}
</style>

<header class="top"><div class="wrap">
  <button class="logo" id="logo" aria-label="回到地图"><span id="logomas"></span><b>易道能力岛</b></button>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="main"></main>
<canvas id="fx"></canvas>
<div class="toast" id="toast" hidden></div>
