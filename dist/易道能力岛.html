<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>易道能力岛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* 布局概念：一本摊开的线装书 + 一片海。地图是海上 30 座岛；课文页像书页一样有界栏，对读页竖排。 */
:root{
  --paper:#ECEFE7;      /* 宣纸，略偏青 */
  --card:#F7F8F3;
  --ink:#1D2534;        /* 书中界栏的藏青墨 */
  --muted:#5A6472;
  --line:#BCC3B8;
  --sea:#2A8794;        /* 桌布的青碧色 */
  --sea-soft:#D4E6E5;
  --sea-deep:#C3DCDB;
  --seal:#B3352B;       /* 朱砂印 */
  --good:#2F7D4F; --bad:#B3352B;
  --f-brush:"Ma Shan Zheng","STXingkai","KaiTi","Kaiti SC",serif;
  --f-serif:"Noto Serif SC","Songti SC","SimSun","STSong",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161C;--card:#182029;--ink:#E2E6DC;--muted:#9AA4AA;--line:#2F3A45;
  --sea:#53B4BF;--sea-soft:#17303A;--sea-deep:#1B3A44;--seal:#E06A5E;--good:#5DBB84;--bad:#E06A5E;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161C;--card:#182029;--ink:#E2E6DC;--muted:#9AA4AA;--line:#2F3A45;
  --sea:#53B4BF;--sea-soft:#17303A;--sea-deep:#1B3A44;--seal:#E06A5E;--good:#5DBB84;--bad:#E06A5E;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-serif);font-size:16px;line-height:1.75;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.brush{font-family:var(--f-brush);font-weight:400}
.eyebrow{font-family:var(--f-sans);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.sans{font-family:var(--f-sans)}

/* 顶栏 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.logo{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0}
.logo b{font-family:var(--f-brush);font-size:30px;font-weight:400;letter-spacing:.04em}
.logo span{font-family:var(--f-sans);font-size:12px;color:var(--muted)}
.stats{display:flex;align-items:center;gap:14px;font-family:var(--f-sans);font-size:13px;margin-left:auto}
.lv{display:flex;align-items:center;gap:8px}
.lv i{font-style:normal;border:1px solid var(--seal);color:var(--seal);padding:0 6px;border-radius:4px}
.xpbar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.xpbar>div{height:100%;background:var(--sea)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;width:100%;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;font-family:var(--f-sans);font-size:14px;white-space:nowrap;color:var(--muted)}
nav.tabs button.on{color:var(--ink);border-color:var(--seal)}

/* 通用 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-family:var(--f-sans);font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
section.view{display:grid;gap:22px;padding-top:22px}
.head2{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
.head2 h2{font-size:28px}

/* 今日 + 地图 */
.today{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.today .big{font-family:var(--f-brush);font-size:44px;line-height:1.1}
.today ul{margin:8px 0 14px;padding-left:1.2em}
.tile{display:grid;gap:4px}
.tile b{font-family:var(--f-sans);font-size:26px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.map{background:var(--sea-soft);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.isle{cursor:pointer}
.isle .land{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.isle.lock{cursor:not-allowed}
.isle.lock .land{fill:var(--sea-deep);stroke:var(--line)}
.isle.lock text{fill:var(--muted)}
.isle.cur .land{stroke:var(--seal);stroke-width:3}
.isle text{fill:var(--ink);font-family:var(--f-serif)}
.isle:focus-visible .land{stroke:var(--sea);stroke-width:4}
.isle:hover:not(.lock) .land{fill:var(--paper)}
.seaname{fill:var(--sea);font-family:var(--f-brush)}
.path{stroke:var(--sea);stroke-width:2;stroke-dasharray:3 7;fill:none;opacity:.7}
.wave{stroke:var(--sea);opacity:.25;fill:none;stroke-width:1.5}

/* 课程 */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-family:var(--f-sans);font-size:13px;color:var(--muted)}
.steps button.on{border-color:var(--ink);color:var(--ink)}
.steps button.seen::before{content:"✓ ";color:var(--good)}
.page{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px clamp(16px,4vw,36px);display:grid;gap:16px;position:relative}
.page::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.page>*{position:relative}
.ph{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.ph h3{font-size:26px}
.ph .eyebrow{flex-basis:100%}
.yw{font-size:20px;line-height:2.1;letter-spacing:.04em;max-width:40em}
.yw .c{cursor:pointer;border-bottom:1px dashed transparent}
.yw .c.h{color:transparent;border-bottom-color:var(--muted);user-select:none}
.key{border-left:3px solid var(--seal);padding:4px 12px;font-weight:600;max-width:40em}
.bh{max-width:42em}
.lab{font-family:var(--f-sans);font-size:12px;letter-spacing:.12em;color:var(--sea);font-weight:500;margin-bottom:2px}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.case{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.yong{font-family:var(--f-sans);font-size:14px;background:var(--sea-soft);padding:8px 12px;border-radius:6px}
.tools{display:flex;gap:6px;margin-left:auto}
.gtop{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hexa{flex:none}
.hexa rect{fill:var(--ink)}
.yao{display:grid;gap:0;border-top:1px solid var(--line)}
.yao>div{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--line)}
.yao .p{font-weight:600}
.yao .w{font-family:var(--f-sans);font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-family:var(--f-sans);font-size:14px;color:var(--sea)}

/* 对读：竖排书页 */
.bookwrap{overflow-x:auto;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:18px}
.book{writing-mode:vertical-rl;height:24em;font-size:19px;line-height:2.3em;letter-spacing:.06em;padding:0 .2em;
  background-image:repeating-linear-gradient(to left,var(--line) 0 1px,transparent 1px 2.3em);border-left:3px double var(--ink);border-right:3px double var(--ink);margin-left:auto;width:max-content}
.book p{margin:0}
.book .hd{font-weight:900}
.book .q{color:var(--muted)}
.book .an{text-indent:2em}
.book.h{writing-mode:horizontal-tb;height:auto;width:auto;max-width:42em;background:none;border:0;line-height:2}
.pairlabel{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-sans);font-size:14px}

/* 测验 */
.quiz{max-width:720px;width:100%;margin:0 auto;display:grid;gap:16px}
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qbar>div{height:100%;background:var(--sea);transition:width .3s}
.qq{font-size:20px;line-height:1.7}
.qsub{background:var(--paper);border-radius:6px;padding:10px 14px;font-size:15px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fb{font-family:var(--f-sans);font-size:14px;border-radius:6px;padding:10px 12px;background:var(--paper)}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.seals{display:flex;gap:10px}
.sealmark{width:54px;height:54px;border:3px solid var(--line);color:var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--f-brush);font-size:28px;transform:rotate(-6deg)}
.sealmark.on{border-color:var(--seal);color:var(--seal);animation:stamp .4s ease-out both}
@keyframes stamp{from{transform:scale(1.8) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.sealmark.on{animation:none}.qbar>div{transition:none}}

/* 经典库 */
.grid-n{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid-n button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:13px;min-width:0}
.grid-n button b{font-family:var(--f-sans);font-size:16px;font-variant-numeric:tabular-nums}
.grid-n button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.grid-n button.learned{border-color:var(--sea)}
.search{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;color:var(--ink);min-width:0;flex:1 1 200px}
.tri{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tri>div{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;justify-items:center;gap:2px;text-align:center;background:var(--card)}
.tri b{font-size:20px}
.basics{display:grid;gap:14px;max-width:46em}
.basics h3{font-size:20px}
table.t{border-collapse:collapse;font-size:15px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.tablewrap{overflow-x:auto}
textarea{width:100%;min-height:80px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.note{font-family:var(--f-sans);font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-family:var(--f-sans);font-size:14px;z-index:20}
.code-in{font-family:var(--f-sans);font-size:28px;letter-spacing:.3em;width:7em;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
@media (max-width:760px){
  .today,.cases,.two{grid-template-columns:1fr}
  .tri{grid-template-columns:repeat(2,1fr)}
  .yao>div{grid-template-columns:1fr}
  .stats{margin-left:0}
  .xpbar{width:60px}
  .head2 h2{font-size:24px}
  .yw{font-size:18px}
}
</style>

<header class="top"><div class="wrap">
  <button class="logo" id="logo" aria-label="回到地图"><b>易道能力岛</b><span>30天 · 周易 × 道德经</span></button>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>
<script>
// 原文：《道德经》王弼本、《周易》通行本（来源：维基文库），由 tools/parse_sources.py 生成
window.DDJ=[{"n": 1, "s": "道可道，非常道，名可名，非常名；无名，天地之始，有名，万物之母。故常无欲，以观其妙，常有欲，以观其徼；此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。", "t": "道可道，非常道，名可名，非常名；無名，天地之始，有名，萬物之母。故常無欲，以觀其妙，常有欲，以觀其徼；此兩者，同出而異名，同謂之玄。玄之又玄，眾妙之門。"}, {"n": 2, "s": "天下皆知美之为美，斯恶已。皆知善之为善，斯不善已。故有无相生，难易相成，长短相较，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教；万物作焉而不辞，生而不有，为而不恃，功成而弗居。夫唯弗居，是以不去。", "t": "天下皆知美之為美，斯惡已。皆知善之為善，斯不善已。故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。是以聖人處無為之事，行不言之教；萬物作焉而不辭，生而不有，為而不恃，功成而弗居。夫唯弗居，是以不去。"}, {"n": 3, "s": "不尚贤，使民不争；不贵难得之货，使民不为盗；不见可欲，使民心不乱。是以圣人之治，虚其心，实其腹，弱其志，强其骨。常使民无知无欲。使夫智者不敢为也。为无为，则无不治。", "t": "不尚賢，使民不爭；不貴難得之貨，使民不為盜；不見可欲，使民心不亂。是以聖人之治，虛其心，實其腹，弱其志，強其骨。常使民無知無欲。使夫智者不敢為也。為無為，則無不治。"}, {"n": 4, "s": "道冲而用之或不盈，渊兮似万物之宗；挫其锐，解其纷，和其光，同其尘，湛兮似或存。吾不知谁之子，象帝之先。", "t": "道沖而用之或不盈，淵兮似萬物之宗；挫其銳，解其紛，和其光，同其塵，湛兮似或存。吾不知誰之子，象帝之先。"}, {"n": 5, "s": "天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。天地之间，其犹橐籥乎？虚而不屈，动而愈出。多言数穷，不如守中。", "t": "天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗。天地之間，其猶橐籥乎？虛而不屈，動而愈出。多言數窮，不如守中。"}, {"n": 6, "s": "谷神不死，是谓玄牝。玄牝之门，是谓天地根。绵绵若存，用之不勤。", "t": "谷神不死，是謂玄牝。玄牝之門，是謂天地根。緜緜若存，用之不勤。"}, {"n": 7, "s": "天长地久。天地所以能长且久者，以其不自生，故能长生。是以圣人后其身而身先；外其身而身存。非以其无私邪，故能成其私。", "t": "天長地久。天地所以能長且久者，以其不自生，故能長生。是以聖人後其身而身先；外其身而身存。非以其無私邪，故能成其私。"}, {"n": 8, "s": "上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。夫唯不争，故无尤。", "t": "上善若水。水善利萬物而不爭，處眾人之所惡，故幾於道。居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。夫唯不爭，故無尤。"}, {"n": 9, "s": "持而盈之，不如其已；揣而棁之，不可长保。金玉满堂，莫之能守；富贵而骄，自遗其咎。功遂身退，天之道。", "t": "持而盈之，不如其已；揣而梲之，不可長保。金玉滿堂，莫之能守；富貴而驕，自遺其咎。功遂身退，天之道。"}, {"n": 10, "s": "载营魄抱一，能无离乎？专气致柔，能婴儿乎？涤除玄览，能无疵乎？爱国治民，能无知乎？天门开阖，能为雌乎？明白四达，能无为乎？生之，畜之。生而不有，为而不恃，长而不宰，是谓玄德。", "t": "載營魄抱一，能無離乎？專氣致柔，能嬰兒乎？滌除玄覽，能無疵乎？愛國治民，能無知乎？天門開闔，能為雌乎？明白四達，能無為乎？生之，畜之。生而不有，為而不恃，長而不宰，是謂玄德。"}, {"n": 11, "s": "三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。", "t": "三十輻共一轂，當其無，有車之用。埏埴以為器，當其無，有器之用。鑿戶牖以為室，當其無，有室之用。故有之以為利，無之以為用。"}, {"n": 12, "s": "五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂，难得之货令人行妨。是以圣人为腹不为目，故去彼取此。", "t": "五色令人目盲，五音令人耳聾，五味令人口爽，馳騁畋獵令人心發狂，難得之貨令人行妨。是以聖人為腹不為目，故去彼取此。"}, {"n": 13, "s": "宠辱若惊，贵大患若身。何谓宠辱若惊？宠为下，得之若惊，失之若惊，是谓宠辱若惊。何谓贵大患若身？吾所以有大患者，为吾有身，及吾无身，吾有何患？故贵以身为天下，若可寄天下；爱以身为天下，若可托天下。", "t": "寵辱若驚，貴大患若身。何謂寵辱若驚？寵為下，得之若驚，失之若驚，是謂寵辱若驚。何謂貴大患若身？吾所以有大患者，為吾有身，及吾無身，吾有何患？故貴以身為天下，若可寄天下；愛以身為天下，若可託天下。"}, {"n": 14, "s": "视之不见名曰夷，听之不闻名曰希，搏之不得名曰微。此三者，不可致诘，故混而为一。其上不皦，其下不昧。绳绳不可名，复归于无物。是谓无状之状，无物之象，是谓惚恍。迎之不见其首，随之不见其后。执古之道，以御今之有。能知古始，是谓道纪。", "t": "視之不見名曰夷，聽之不聞名曰希，搏之不得名曰微。此三者，不可致詰，故混而為一。其上不皦，其下不昧。繩繩不可名，復歸於無物。是謂無狀之狀，無物之象，是謂惚恍。迎之不見其首，隨之不見其後。執古之道，以御今之有。能知古始，是謂道紀。"}, {"n": 15, "s": "古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容。豫焉若冬涉川，犹兮若畏四邻，俨兮其若容，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以久动之徐生？保此道者不欲盈，夫唯不盈，故能蔽不新成。", "t": "古之善為士者，微妙玄通，深不可識。夫唯不可識，故強為之容。豫焉若冬涉川，猶兮若畏四鄰，儼兮其若容，渙兮若冰之將釋，敦兮其若樸，曠兮其若谷，混兮其若濁。孰能濁以靜之徐清？孰能安以久動之徐生？保此道者不欲盈，夫唯不盈，故能蔽不新成。"}, {"n": 16, "s": "致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。归根曰静，是谓复命。复命曰常，知常曰明。不知常，妄作凶。知常容，容乃公，公乃全，全乃天，天乃道，道乃久，没身不殆。", "t": "致虛極，守靜篤。萬物並作，吾以觀復。夫物芸芸，各復歸其根。歸根曰靜，是謂復命。復命曰常，知常曰明。不知常，妄作凶。知常容，容乃公，公乃全，全乃天，天乃道，道乃久，沒身不殆。"}, {"n": 17, "s": "太上，下知有之，其次，亲而誉之，其次，畏之，其次，侮之。信不足焉，有不信焉。悠兮其贵言，功成事遂，百姓皆谓：我自然。", "t": "太上，下知有之，其次，親而譽之，其次，畏之，其次，侮之。信不足焉，有不信焉。悠兮其貴言，功成事遂，百姓皆謂：我自然。"}, {"n": 18, "s": "大道废，有仁义；智慧出，有大伪；六亲不和，有孝慈；国家昏乱，有忠臣。", "t": "大道廢，有仁義；智慧出，有大偽；六親不和，有孝慈；國家昏亂，有忠臣。"}, {"n": 19, "s": "绝圣弃智，民利百倍；绝仁弃义，民复孝慈；绝巧弃利，盗贼无有。此三者以为文不足，故令有所属﹕见素抱朴，少私寡欲。", "t": "絕聖棄智，民利百倍；絕仁棄義，民復孝慈；絕巧棄利，盜賊無有。此三者以為文不足，故令有所屬﹕見素抱樸，少私寡欲。"}, {"n": 20, "s": "绝学无忧，唯之与阿，相去几何？善之与恶，相去若何？人之所畏，不可不畏。荒兮其未央哉﹗众人熙熙，如享太牢，如春登台。我独泊兮其未兆，如婴儿之未孩；儽儽兮若无所归。众人皆有余，而我独若遗。我愚人之心也哉﹗沌沌兮，俗人昭昭，我独昏昏。俗人察察，我独闷闷。澹兮其若海，飂兮若无止。众人皆有以，而我独顽似鄙。我独异于人，而贵食母。", "t": "絕學無憂，唯之與阿，相去幾何？善之與惡，相去若何？人之所畏，不可不畏。荒兮其未央哉﹗眾人熙熙，如享太牢，如春登臺。我獨泊兮其未兆，如嬰兒之未孩；儽儽兮若無所歸。眾人皆有餘，而我獨若遺。我愚人之心也哉﹗沌沌兮，俗人昭昭，我獨昏昏。俗人察察，我獨悶悶。澹兮其若海，飂兮若無止。眾人皆有以，而我獨頑似鄙。我獨異於人，而貴食母。"}, {"n": 21, "s": "孔德之容，惟道是从。道之为物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物。窈兮冥兮，其中有精；其精甚真，其中有信。自今及古，其名不去，以阅众甫。吾何以知众甫之状哉？以此。", "t": "孔德之容，惟道是從。道之為物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物。窈兮冥兮，其中有精；其精甚真，其中有信。自今及古，其名不去，以閱眾甫。吾何以知眾甫之狀哉？以此。"}, {"n": 22, "s": "曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见故明，不自是故彰，不自伐故有功，不自矜故长。夫唯不争，故天下莫能与之争。古之所谓曲则全者，岂虚言哉！诚全而归之。", "t": "曲則全，枉則直，窪則盈，敝則新，少則得，多則惑。是以聖人抱一為天下式。不自見故明，不自是故彰，不自伐故有功，不自矜故長。夫唯不爭，故天下莫能與之爭。古之所謂曲則全者，豈虛言哉！誠全而歸之。"}, {"n": 23, "s": "希言自然。故飘风不终朝，骤雨不终日。孰为此者？天地。天地尚不能久，而况于人乎？故从事于道者，道者同于道，德者同于德，失者同于失。同于道者，道亦乐得之；同于德者，德亦乐得之；同于失者，失亦乐得之。信不足焉，有不信焉。", "t": "希言自然。故飄風不終朝，驟雨不終日。孰為此者？天地。天地尚不能久，而況於人乎？故從事於道者，道者同於道，德者同於德，失者同於失。同於道者，道亦樂得之；同於德者，德亦樂得之；同於失者，失亦樂得之。信不足焉，有不信焉。"}, {"n": 24, "s": "企者不立，跨者不行，自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。", "t": "企者不立，跨者不行，自見者不明，自是者不彰，自伐者無功，自矜者不長。其在道也，曰餘食贅行。物或惡之，故有道者不處。"}, {"n": 25, "s": "有物混成，先天地生。寂兮寥兮，独立而不改，周行而不殆，可以为天下母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。", "t": "有物混成，先天地生。寂兮寥兮，獨立而不改，周行而不殆，可以為天下母。吾不知其名，字之曰道，強為之名曰大。大曰逝，逝曰遠，遠曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。"}, {"n": 26, "s": "重为轻根，静为躁君。是以圣人终日行不离辎重。虽有荣观，燕处超然。奈何万乘之主，而以身轻天下？轻则失本，躁则失君。", "t": "重為輕根，靜為躁君。是以聖人終日行不離輜重。雖有榮觀，燕處超然。奈何萬乘之主，而以身輕天下？輕則失本，躁則失君。"}, {"n": 27, "s": "善行无辙迹，善言无瑕讁；善数不用筹策；善闭无关楗而不可开，善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物，是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。", "t": "善行無轍迹，善言無瑕讁；善數不用籌策；善閉無關楗而不可開，善結無繩約而不可解。是以聖人常善救人，故無棄人；常善救物，故無棄物，是謂襲明。故善人者，不善人之師；不善人者，善人之資。不貴其師，不愛其資，雖智大迷，是謂要妙。"}, {"n": 28, "s": "知其雄，守其雌，为天下溪。为天下溪，常德不离，复归于婴儿。知其白，守其黑，为天下式。为天下式，常德不忒，复归于无极。知其荣，守其辱，为天下谷，常德乃足，复归于朴。朴散则为器，圣人用之，则为官长，故大制不割。", "t": "知其雄，守其雌，為天下谿。為天下谿，常德不離，復歸於嬰兒。知其白，守其黑，為天下式。為天下式，常德不忒，復歸於無極。知其榮，守其辱，為天下谷，常德乃足，復歸於樸。樸散則為器，聖人用之，則為官長，故大制不割。"}, {"n": 29, "s": "将欲取天下而为之，吾见其不得已。天下神器，不可为也，为者败之，执者失之。故物或行或随，或歔或吹。或强或羸，或挫或隳。是以圣人去甚，去奢，去泰。", "t": "將欲取天下而為之，吾見其不得已。天下神器，不可為也，為者敗之，執者失之。故物或行或隨，或歔或吹。或強或羸，或挫或隳。是以聖人去甚，去奢，去泰。"}, {"n": 30, "s": "以道佐人主者，不以兵强天下。其事好还。师之所处，荆棘生焉。大军之后，必有凶年。善有果而已，不敢以取强。果而勿矜，果而勿伐，果而勿骄。果而不得已，果而勿强。物壮则老，是谓不道，不道早已。", "t": "以道佐人主者，不以兵強天下。其事好還。師之所處，荊棘生焉。大軍之後，必有凶年。善有果而已，不敢以取強。果而勿矜，果而勿伐，果而勿驕。果而不得已，果而勿強。物壯則老，是謂不道，不道早已。"}, {"n": 31, "s": "夫佳兵者，不祥之器，物或恶之，故有道者不处。君子居则贵左，用兵则贵右。兵者不祥之器，非君子之器，不得已而用之，恬淡为上。胜而不美，而美之者，是乐杀人。夫乐杀人者，则不可以得志于天下矣。吉事尚左，凶事尚右。偏将军居左，上将军居右，言以丧礼处之。杀人之众，以哀悲泣之，战胜，以丧礼处之。", "t": "夫佳兵者，不祥之器，物或惡之，故有道者不處。君子居則貴左，用兵則貴右。兵者不祥之器，非君子之器，不得已而用之，恬淡為上。勝而不美，而美之者，是樂殺人。夫樂殺人者，則不可以得志於天下矣。吉事尚左，凶事尚右。偏將軍居左，上將軍居右，言以喪禮處之。殺人之眾，以哀悲泣之，戰勝，以喪禮處之。"}, {"n": 32, "s": "道常无名，朴虽小，天下莫能臣也。侯王若能守之，万物将自宾。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦将知止，知止所以不殆。譬道之在天下，犹川谷之于江海。", "t": "道常無名，樸雖小，天下莫能臣也。侯王若能守之，萬物將自賓。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦將知止，知止所以不殆。譬道之在天下，猶川谷之於江海。"}, {"n": 33, "s": "知人者智，自知者明。胜人者有力，自胜者强。知足者富。强行者有志。不失其所者久。死而不亡者寿。", "t": "知人者智，自知者明。勝人者有力，自勝者強。知足者富。強行者有志。不失其所者久。死而不亡者壽。"}, {"n": 34, "s": "大道泛兮，其可左右。万物恃之而生而不辞，功成不名有。衣养万物而不为主，常无欲，可名于小；万物归焉而不为主，可名为大。以其终不自为大，故能成其大。", "t": "大道氾兮，其可左右。萬物恃之而生而不辭，功成不名有。衣養萬物而不為主，常無欲，可名於小；萬物歸焉而不為主，可名為大。以其終不自為大，故能成其大。"}, {"n": 35, "s": "执大象，天下往。往而不害，安平太。乐与饵，过客止。道之出口，淡乎其无味，视之不足见，听之不足闻，用之不足既。", "t": "執大象，天下往。往而不害，安平太。樂與餌，過客止。道之出口，淡乎其無味，視之不足見，聽之不足聞，用之不足既。"}, {"n": 36, "s": "将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲夺之，必固与之。是谓微明。柔弱胜刚强。鱼不可脱于渊，国之利器不可以示人。", "t": "將欲歙之，必固張之；將欲弱之，必固強之；將欲廢之，必固興之；將欲奪之，必固與之。是謂微明。柔弱勝剛強。魚不可脫於淵，國之利器不可以示人。"}, {"n": 37, "s": "道常无为而无不为。侯王若能守之，万物将自化。化而欲作，吾将镇之以无名之朴。无名之朴，夫亦将无欲。不欲以静，天下将自定。", "t": "道常無為而無不為。侯王若能守之，萬物將自化。化而欲作，吾將鎮之以無名之樸。無名之樸，夫亦將無欲。不欲以靜，天下將自定。"}, {"n": 38, "s": "上德不德，是以有德；下德不失德，是以无德。上德无为而无以为，下德为之而有以为。上仁为之而无以为，上义为之而有以为。上礼为之而莫之应， 则攘臂而扔之。故失道而后德，失德而后仁，失仁而后义，失义而后礼。夫礼者，忠信之薄，而乱之首。前识者，道之华，而愚之始。是以大丈夫处其厚，不居其薄；处其实，不居其华。故去彼取此。", "t": "上德不德，是以有德；下德不失德，是以無德。上德無為而無以為，下德為之而有以為。上仁為之而無以為，上義為之而有以為。上禮為之而莫之應， 則攘臂而扔之。故失道而後德，失德而後仁，失仁而後義，失義而後禮。夫禮者，忠信之薄，而亂之首。前識者，道之華，而愚之始。是以大丈夫處其厚，不居其薄；處其實，不居其華。故去彼取此。"}, {"n": 39, "s": "昔之得一者，天得一以清，地得一以宁，神得一以灵，谷得一以盈，万物得一以生，侯王得一以为天下贞。其致之，天无以清将恐裂，地无以宁将恐发，神无以灵将恐歇，谷无以盈将恐竭，万物无以生将恐灭，侯王无以贵高将恐蹶。故贵以贱为本，高以下为基。是以侯王自称孤﹑寡﹑不谷。此非以贱为本邪？非乎？故致数舆无舆，不欲琭琭如玉，珞珞如石。", "t": "昔之得一者，天得一以清，地得一以寧，神得一以靈，谷得一以盈，萬物得一以生，侯王得一以為天下貞。其致之，天無以清將恐裂，地無以寧將恐發，神無以靈將恐歇，谷無以盈將恐竭，萬物無以生將恐滅，侯王無以貴高將恐蹶。故貴以賤為本，高以下為基。是以侯王自稱孤﹑寡﹑不穀。此非以賤為本邪？非乎？故致數輿無輿，不欲琭琭如玉，珞珞如石。"}, {"n": 40, "s": "反者道之动，弱者道之用。天下万物生于有，有生于无。", "t": "反者道之動，弱者道之用。天下萬物生於有，有生於無。"}, {"n": 41, "s": "上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之。不笑不足以为道。故建言有之﹕明道若昧，进道若退，夷道若颣，上德若谷，大白若辱，广德若不足，建德若偷，质真若渝，大方无隅，大器晚成，大音希声，大象无形，道隐无名。夫唯道，善贷且成。", "t": "上士聞道，勤而行之；中士聞道，若存若亡；下士聞道，大笑之。不笑不足以為道。故建言有之﹕明道若昧，進道若退，夷道若纇，上德若谷，大白若辱，廣德若不足，建德若偷，質真若渝，大方無隅，大器晚成，大音希聲，大象無形，道隱無名。夫唯道，善貸且成。"}, {"n": 42, "s": "道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤﹑寡﹑不谷，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。", "t": "道生一，一生二，二生三，三生萬物。萬物負陰而抱陽，沖氣以為和。人之所惡，唯孤﹑寡﹑不穀，而王公以為稱。故物或損之而益，或益之而損。人之所教，我亦教之。強梁者不得其死，吾將以為教父。"}, {"n": 43, "s": "天下之至柔，驰骋天下之至坚。无有入无间，吾是以知无为之有益。不言之教，无为之益，天下希及之。", "t": "天下之至柔，馳騁天下之至堅。無有入無間，吾是以知無為之有益。不言之教，無為之益，天下希及之。"}, {"n": 44, "s": "名与身孰亲？身与货孰多？得与亡孰病？是故甚爱必大费，多藏必厚亡，知足不辱，知止不殆，可以长久。", "t": "名與身孰親？身與貨孰多？得與亡孰病？是故甚愛必大費，多藏必厚亡，知足不辱，知止不殆，可以長久。"}, {"n": 45, "s": "大成若缺，其用不弊。大盈若冲，其用不穷。大直若屈，其用不居。大巧若拙，其用不辍。大辩若讷，其用不差。躁胜寒，静胜热。清静为天下正。", "t": "大成若缺，其用不弊。大盈若沖，其用不窮。大直若屈，其用不居。大巧若拙，其用不輟。大辯若訥，其用不差。躁勝寒，靜勝熱。清靜為天下正。"}, {"n": 46, "s": "天下有道，却走马以粪。天下无道，戎马生于郊。祸莫大于不知足；咎莫大于欲得。故知足之足，常足矣。", "t": "天下有道，卻走馬以糞。天下無道，戎馬生於郊。禍莫大於不知足；咎莫大於欲得。故知足之足，常足矣。"}, {"n": 47, "s": "不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。是以圣人不行而知，不见而名，不为而成。", "t": "不出戶，知天下；不闚牖，見天道。其出彌遠，其知彌少。是以聖人不行而知，不見而名，不為而成。"}, {"n": 48, "s": "为学日益，为道日损。损之又损，以至于无为。无为而无不为。取天下常以无事，及其有事，不足以取天下。", "t": "為學日益，為道日損。損之又損，以至於無為。無為而無不為。取天下常以無事，及其有事，不足以取天下。"}, {"n": 49, "s": "圣人无常心，以百姓心为心。善者，吾善之；不善者，吾亦善之，德善。信者，吾信之；不信者，吾亦信之，德信。圣人在天下歙歙，为天下浑其心，百姓皆注其耳目,圣人皆孩之。", "t": "聖人無常心，以百姓心為心。善者，吾善之；不善者，吾亦善之，德善。信者，吾信之；不信者，吾亦信之，德信。聖人在天下歙歙，為天下渾其心，百姓皆注其耳目,聖人皆孩之。"}, {"n": 50, "s": "出生入死。生之徒，十有三；死之徒，十有三；人之生，动之死地，亦十有三。夫何故？以其生生之厚。盖闻善摄生者，陆行不遇兕虎，入军不被甲兵；兕无所投其角，虎无所措其爪，兵无所容其刃。夫何故？以其无死地。", "t": "出生入死。生之徒，十有三；死之徒，十有三；人之生，動之死地，亦十有三。夫何故？以其生生之厚。蓋聞善攝生者，陸行不遇兕虎，入軍不被甲兵；兕無所投其角，虎無所措其爪，兵無所容其刃。夫何故？以其無死地。"}, {"n": 51, "s": "道生之，德畜之，物形之，势成之。是以万物莫不尊道而贵德。道之尊，德之贵，夫莫之命而常自然。故道生之，德畜之。长之育之，亭之毒之，盖之覆之。生而不有，为而不恃，长而不宰。是谓玄德。", "t": "道生之，德畜之，物形之，勢成之。是以萬物莫不尊道而貴德。道之尊，德之貴，夫莫之命而常自然。故道生之，德畜之。長之育之，亭之毒之，蓋之覆之。生而不有，為而不恃，長而不宰。是謂玄德。"}, {"n": 52, "s": "天下有始，以为天下母。既得其母，以知其子，既知其子，复守其母，没身不殆。塞其兑，闭其门，终身不勤。开其兑，济其事，终身不救。见小曰明，守柔曰强。用其光，复归其明，无遗身殃，是为习常。", "t": "天下有始，以為天下母。既得其母，以知其子，既知其子，復守其母，沒身不殆。塞其兌，閉其門，終身不勤。開其兌，濟其事，終身不救。見小曰明，守柔曰強。用其光，復歸其明，無遺身殃，是為習常。"}, {"n": 53, "s": "使我介然有知，行于大道，唯施是畏。大道甚夷，而民好径。朝甚除，田甚芜，仓甚虚；服文彩，带利剑，厌饮食，财货有余；是为盗夸。非道也哉！", "t": "使我介然有知，行於大道，唯施是畏。大道甚夷，而民好徑。朝甚除，田甚蕪，倉甚虛；服文綵，帶利劍，厭飲食，財貨有餘；是為盜夸。非道也哉！"}, {"n": 54, "s": "善建者不拔，善抱者不脱，子孙以祭祀不辍。修之于身，其德乃真；修之于家，其德乃余；修之于乡，其德乃长；修之于国，其德乃丰；修之于天下，其德乃普。故以身观身，以家观家，以乡观乡，以国观国，以天下观天下。吾何以知天下然哉？以此。", "t": "善建者不拔，善抱者不脫，子孫以祭祀不輟。修之於身，其德乃真；修之於家，其德乃餘；修之於鄉，其德乃長；修之於國，其德乃豐；修之於天下，其德乃普。故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。吾何以知天下然哉？以此。"}, {"n": 55, "s": "含德之厚，比于赤子。蜂虿虺蛇不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固。未知牝牡之合而全作，精之至也。终日号而不嗄，和之至也。知和曰常，知常曰明。益生曰祥。心使气曰强。物壮则老，谓之不道，不道早已。", "t": "含德之厚，比於赤子。蜂蠆虺蛇不螫，猛獸不據，攫鳥不搏。骨弱筋柔而握固。未知牝牡之合而全作，精之至也。終日號而不嗄，和之至也。知和曰常，知常曰明。益生曰祥。心使氣曰強。物壯則老，謂之不道，不道早已。"}, {"n": 56, "s": "知者不言，言者不知。塞其兑，闭其门，挫其锐，解其分，和其光，同其尘，是谓玄同。故不可得而亲，不可得而疏；不可得而利，不可得而害；不可得而贵，不可得而贱。故为天下贵。", "t": "知者不言，言者不知。塞其兌，閉其門，挫其銳，解其分，和其光，同其塵，是謂玄同。故不可得而親，不可得而疏；不可得而利，不可得而害；不可得而貴，不可得而賤。故為天下貴。"}, {"n": 57, "s": "以正治国，以奇用兵，以无事取天下。吾何以知其然哉？以此。天下多忌讳，而民弥贫；民多利器，国家滋昬；人多伎巧，奇物滋起；法令滋彰，盗贼多有。故圣人云﹕「我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴。」", "t": "以正治國，以奇用兵，以無事取天下。吾何以知其然哉？以此。天下多忌諱，而民彌貧；民多利器，國家滋昬；人多伎巧，奇物滋起；法令滋彰，盜賊多有。故聖人云﹕「我無為而民自化，我好靜而民自正，我無事而民自富，我無欲而民自樸。」"}, {"n": 58, "s": "其政闷闷，其民淳淳；其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。孰知其极？其无正。正复为奇，善复为妖。人之迷，其日固久。是以圣人方而不割，廉而不刿，直而不肆，光而不燿。", "t": "其政悶悶，其民淳淳；其政察察，其民缺缺。禍兮福之所倚，福兮禍之所伏。孰知其極？其無正。正復為奇，善復為妖。人之迷，其日固久。是以聖人方而不割，廉而不劌，直而不肆，光而不燿。"}, {"n": 59, "s": "治人事天，莫若啬。夫唯啬，是谓早服；早服谓之重积德；重积德则无不克，无不克则莫知其极；莫知其极，可以有国；有国之母，可以长久；是谓深根固柢，长生久视之道。", "t": "治人事天，莫若嗇。夫唯嗇，是謂早服；早服謂之重積德；重積德則無不克，無不克則莫知其極；莫知其極，可以有國；有國之母，可以長久；是謂深根固柢，長生久視之道。"}, {"n": 60, "s": "治大国，若烹小鲜。以道莅天下，其鬼不神；非其鬼不神，其神不伤人；非其神不伤人，圣人亦不伤人。夫两不相伤，故德交归焉。", "t": "治大國，若烹小鮮。以道莅天下，其鬼不神；非其鬼不神，其神不傷人；非其神不傷人，聖人亦不傷人。夫兩不相傷，故德交歸焉。"}, {"n": 61, "s": "大国者下流，天下之交。天下之牝，牝常以静胜牡，以静为下。故大国以下小国，则取小国；小国以下大国，则取大国。故或下以取，或下而取。大国不过欲兼畜人，小国不过欲入事人。夫两者各得其所欲，大者宜为下。", "t": "大國者下流，天下之交。天下之牝，牝常以靜勝牡，以靜為下。故大國以下小國，則取小國；小國以下大國，則取大國。故或下以取，或下而取。大國不過欲兼畜人，小國不過欲入事人。夫兩者各得其所欲，大者宜為下。"}, {"n": 62, "s": "道者万物之奥。善人之宝，不善人之所保。美言可以市，尊行可以加人。人之不善，何弃之有？故立天子，置三公，虽有拱璧以先驷马，不如坐进此道。古之所以贵此道者何？不曰以求得，有罪以免邪？故为天下贵。", "t": "道者萬物之奧。善人之寶，不善人之所保。美言可以市，尊行可以加人。人之不善，何棄之有？故立天子，置三公，雖有拱璧以先駟馬，不如坐進此道。古之所以貴此道者何？不曰以求得，有罪以免邪？故為天下貴。"}, {"n": 63, "s": "为无为，事无事，味无味。大小多少，报怨以德。图难于其易，为大于其细；天下难事必作于易，天下大事必作于细。是以圣人终不为大，故能成其大。夫轻诺必寡信，多易必多难。是以圣人犹难之，故终无难矣", "t": "為無為，事無事，味無味。大小多少，報怨以德。圖難於其易，為大於其細；天下難事必作於易，天下大事必作於細。是以聖人終不為大，故能成其大。夫輕諾必寡信，多易必多難。是以聖人猶難之，故終無難矣"}, {"n": 64, "s": "其安易持，其未兆易谋。其脆易泮，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。为者败之，执者失之。是以圣人无为故无败，无执故无失。民之从事，常于几成而败之。慎终如始，则无败事。是以圣人欲不欲，不贵难得之货；学不学，复众人之所过。以辅万物之自然，而不敢为。", "t": "其安易持，其未兆易謀。其脆易泮，其微易散。為之於未有，治之於未亂。合抱之木，生於毫末；九層之臺，起於累土；千里之行，始於足下。為者敗之，執者失之。是以聖人無為故無敗，無執故無失。民之從事，常於幾成而敗之。慎終如始，則無敗事。是以聖人欲不欲，不貴難得之貨；學不學，復眾人之所過。以輔萬物之自然，而不敢為。"}, {"n": 65, "s": "古之善为道者，非以明民，将以愚之。民之难治，以其智多。故以智治国，国之贼，不以智治国，国之福。知此两者亦稽式。常知稽式，是谓玄德。玄德深矣，远矣，与物反矣，然后乃至大顺。", "t": "古之善為道者，非以明民，將以愚之。民之難治，以其智多。故以智治國，國之賊，不以智治國，國之福。知此兩者亦稽式。常知稽式，是謂玄德。玄德深矣，遠矣，與物反矣，然後乃至大順。"}, {"n": 66, "s": "江海所以能为百谷王者，以其善下之，故能为百谷王。是以欲上民，必以言下之。欲先民，必以身后之。是以圣人处上而民不重，处前而民不害。是以天下乐推而不厌，以其不争，故天下莫能与之争。", "t": "江海所以能為百谷王者，以其善下之，故能為百谷王。是以欲上民，必以言下之。欲先民，必以身後之。是以聖人處上而民不重，處前而民不害。是以天下樂推而不厭，以其不爭，故天下莫能與之爭。"}, {"n": 67, "s": "天下皆谓我道大，似不肖。夫唯大，故似不肖。若肖，久矣其细也夫！我有三宝，持而保之。一曰慈，二曰俭，三曰不敢为天下先。慈故能勇，俭故能广，不敢为天下先，故能成器长。今舍慈且勇，舍俭且广，舍后且先，死矣！夫慈以战则胜，以守则固。天将救之，以慈卫之。", "t": "天下皆謂我道大，似不肖。夫唯大，故似不肖。若肖，久矣其細也夫！我有三寶，持而保之。一曰慈，二曰儉，三曰不敢為天下先。慈故能勇，儉故能廣，不敢為天下先，故能成器長。今舍慈且勇，舍儉且廣，舍後且先，死矣！夫慈以戰則勝，以守則固。天將救之，以慈衛之。"}, {"n": 68, "s": "善为士者不武，善战者不怒，善胜敌者不与，善用人者为之下，是谓不争之德，是谓用人之力，是谓配天古之极。", "t": "善為士者不武，善戰者不怒，善勝敵者不與，善用人者為之下，是謂不爭之德，是謂用人之力，是謂配天古之極。"}, {"n": 69, "s": "用兵有言﹕「吾不敢为主而为客，不敢进寸而退尺。」是谓行无行，攘无臂，扔无敌，执无兵。祸莫大于轻敌，轻敌几丧吾宝。故抗兵相加，哀者胜矣。", "t": "用兵有言﹕「吾不敢為主而為客，不敢進寸而退尺。」是謂行無行，攘無臂，扔無敵，執無兵。禍莫大於輕敵，輕敵幾喪吾寶。故抗兵相加，哀者勝矣。"}, {"n": 70, "s": "吾言甚易知，甚易行。天下莫能知，莫能行。言有宗，事有君。夫唯无知，是以不我知。知我者希，则我者贵。是以圣人被褐怀玉。", "t": "吾言甚易知，甚易行。天下莫能知，莫能行。言有宗，事有君。夫唯無知，是以不我知。知我者希，則我者貴。是以聖人被褐懷玉。"}, {"n": 71, "s": "知不知上，不知知病。夫唯病病，是以不病。圣人不病，以其病病，是以不病。", "t": "知不知上，不知知病。夫唯病病，是以不病。聖人不病，以其病病，是以不病。"}, {"n": 72, "s": "民不畏威，则大威至。无狎其所居，无厌其所生。夫唯不厌，是以不厌。是以圣人自知不自见，自爱不自贵；故去彼取此。", "t": "民不畏威，則大威至。無狎其所居，無厭其所生。夫唯不厭，是以不厭。是以聖人自知不自見，自愛不自貴；故去彼取此。"}, {"n": 73, "s": "勇于敢则杀，勇于不敢则活。此两者，或利或害。天之所恶，孰知其故？是以圣人犹难之。天之道，不争而善胜，不言而善应，不召而自来，𦈎然而善谋。天网恢恢，疏而不失。", "t": "勇於敢則殺，勇於不敢則活。此兩者，或利或害。天之所惡，孰知其故？是以聖人猶難之。天之道，不爭而善勝，不言而善應，不召而自來，繟然而善謀。天網恢恢，疏而不失。"}, {"n": 74, "s": "民不畏死，奈何以死惧之？若使民常畏死，而为奇者，吾得执而杀之，孰敢？常有司杀者杀，夫代司杀者杀，是谓代大匠斲。夫代大匠斲者，希有不伤其手矣。", "t": "民不畏死，奈何以死懼之？若使民常畏死，而為奇者，吾得執而殺之，孰敢？常有司殺者殺，夫代司殺者殺，是謂代大匠斲。夫代大匠斲者，希有不傷其手矣。"}, {"n": 75, "s": "民之饥，以其上食税之多，是以饥。民之难治，以其上之有为，是以难治。民之轻死，以其上求生之厚，是以轻死。夫唯无以生为者，是贤于贵生。", "t": "民之饑，以其上食稅之多，是以饑。民之難治，以其上之有為，是以難治。民之輕死，以其上求生之厚，是以輕死。夫唯無以生為者，是賢於貴生。"}, {"n": 76, "s": "人之生也柔弱，其死也坚强。万物草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。是以兵强则不胜，木强则兵。强大处下，柔弱处上。", "t": "人之生也柔弱，其死也堅強。萬物草木之生也柔脆，其死也枯槁。故堅強者死之徒，柔弱者生之徒。是以兵強則不勝，木強則兵。強大處下，柔弱處上。"}, {"n": 77, "s": "天之道，其犹张弓与？高者抑之，下者举之；有余者损之，不足者补之。天之道，损有余而补不足。人之道则不然，损不足以奉有余。孰能有余以奉天下？唯有道者。是以圣人为而不恃，功成而不处，其不欲见贤。", "t": "天之道，其猶張弓與？高者抑之，下者舉之；有餘者損之，不足者補之。天之道，損有餘而補不足。人之道則不然，損不足以奉有餘。孰能有餘以奉天下？唯有道者。是以聖人為而不恃，功成而不處，其不欲見賢。"}, {"n": 78, "s": "天下莫柔弱于水，而攻坚强者，莫之能胜，其无以易之。弱之胜强，柔之胜刚，天下莫不知莫能行。是以圣人云﹕「受国之垢，是谓社稷主；受国不祥，是为天下王。」正言若反。", "t": "天下莫柔弱於水，而攻堅強者，莫之能勝，其無以易之。弱之勝強，柔之勝剛，天下莫不知莫能行。是以聖人云﹕「受國之垢，是謂社稷主；受國不祥，是為天下王。」正言若反。"}, {"n": 79, "s": "和大怨，必有余怨，安可以为善？是以圣人执左契，而不责于人。有德司契，无德司彻。天道无亲，常与善人。", "t": "和大怨，必有餘怨，安可以為善？是以聖人執左契，而不責於人。有德司契，無德司徹。天道無親，常與善人。"}, {"n": 80, "s": "小国寡民，使有什伯之器而不用，使民重死而不远徙。虽有舟舆，无所乘之；虽有甲兵，无所陈之。使人复结绳而用之，甘其食，美其服，安其居，乐其俗。邻国相望，鸡犬之声相闻，民至老死，不相往来。", "t": "小國寡民，使有什伯之器而不用，使民重死而不遠徙。雖有舟輿，無所乘之；雖有甲兵，無所陳之。使人復結繩而用之，甘其食，美其服，安其居，樂其俗。鄰國相望，雞犬之聲相聞，民至老死，不相往來。"}, {"n": 81, "s": "信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积，既以为人己愈有，既以与人己愈多。天之道，利而不害；圣人之道，为而不争。", "t": "信言不美，美言不信。善者不辯，辯者不善。知者不博，博者不知。聖人不積，既以為人己愈有，既以與人己愈多。天之道，利而不害；聖人之道，為而不爭。"}];
window.GUA=[{"n": 1, "name": "乾", "nameT": "乾", "down": "乾", "up": "乾", "gc": "元亨。利贞。", "gcT": "元亨。利貞。", "yao": ["初九：潜龙勿用。", "九二：见龙在田，利见大人。", "九三：君子终日乾乾，夕惕若；厉，无咎。", "九四：或跃在渊，无咎。", "九五：飞龙在天，利见大人。", "上九：亢龙，有悔。", "用九：见群龙无首，吉。"], "yaoT": ["初九：潛龍勿用。", "九二：見龍在田，利見大人。", "九三：君子終日乾乾，夕惕若；厲，无咎。", "九四：或躍在淵，无咎。", "九五：飛龍在天，利見大人。", "上九：亢龍，有悔。", "用九：見羣龍无首，吉。"], "tuan": "大哉乾元，万物资始，乃统天。云行雨施，品物流形，大明终始，六位时成。时乘六龙以御天，乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。", "dx": "天行健，君子以自强不息。", "dxT": "天行健，君子以自強不息。", "xx": ["潜龙勿用，阳在下也。", "见龙在田，德施普也。", "终日乾乾，反复道也。", "或跃在渊，进无咎也。", "飞龙在天，大人造也。", "亢龙有悔，盈不可久也。", "用九，天德不可为首也。"]}, {"n": 2, "name": "坤", "nameT": "坤", "down": "坤", "up": "坤", "gc": "元亨。利牝马之贞。君子有攸往，先迷后得主。利西南得朋，东北丧朋。安贞，吉。", "gcT": "元亨。利牝馬之貞。君子有攸往，先迷後得主。利西南得朋，東北喪朋。安貞，吉。", "yao": ["初六：履霜，坚冰至。", "六二：直方大，不习无不利。", "六三：含章，可贞。或从王事，无成有终。", "六四：括囊，无咎无誉。", "六五：黄裳，元吉。", "上六：龙战于野，其血玄黄。", "用六：利永贞。"], "yaoT": ["初六：履霜，堅冰至。", "六二：直方大，不習无不利。", "六三：含章，可貞。或從王事，无成有終。", "六四：括囊，无咎无譽。", "六五：黃裳，元吉。", "上六：龍戰于野，其血玄黃。", "用六：利永貞。"], "tuan": "至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆；含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行，东北丧朋，乃终有庆。安贞之吉，应地无疆。", "dx": "地势坤，君子以厚德载物。", "dxT": "地勢坤，君子以厚德載物。", "xx": ["履霜坚冰，阴始凝也。驯致其道，至坚冰也。", "六二之动，直以方也。不习无不利，地道光也。", "含章可贞，以时发也。或从王事，知光大也。", "括囊无咎，慎不害也。", "黄裳元吉，文在中也。", "龙战于野，其道穷也。", "用六永贞，以大终也。"]}, {"n": 3, "name": "屯", "nameT": "屯", "down": "震", "up": "坎", "gc": "元亨，利贞。勿用有攸往，利建侯。", "gcT": "元亨，利貞。勿用有攸往，利建侯。", "yao": ["初九：磐桓，利居贞，利建侯。", "六二：屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。", "六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。", "六四：乘马班如，求婚媾，往，吉无不利。", "九五：屯其膏；小贞吉，大贞凶。", "上六：乘马班如，泣血涟如。"], "yaoT": ["初九：磐桓，利居貞，利建侯。", "六二：屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。", "六三：即鹿无虞，惟入于林中，君子幾不如舍，往吝。", "六四：乘馬班如，求婚媾，往，吉无不利。", "九五：屯其膏；小貞吉，大貞凶。", "上六：乘馬班如，泣血漣如。"], "tuan": "屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。", "dx": "云雷，屯；君子以经纶。", "dxT": "雲雷，屯；君子以經綸。", "xx": ["虽磐桓，志行正也。以贵下贱，大得民也。", "六二之难，乘刚也。十年乃字，反常也。", "即鹿无虞，以从禽也。君子舍之，往吝穷也。", "求而往，明也。", "屯其膏，施未光也。", "泣血涟如，何可长也。"]}, {"n": 4, "name": "蒙", "nameT": "蒙", "down": "坎", "up": "艮", "gc": "亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。", "gcT": "亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。", "yao": ["初六：发蒙，利用刑人，用说桎梏，以往吝。", "九二：包蒙吉，纳妇吉，子克家。", "六三：勿用取女，见金夫，不有躬，无攸利。", "六四：困蒙，吝。", "六五：童蒙，吉。", "上九：击蒙，不利为寇，利御寇。"], "yaoT": ["初六：發蒙，利用刑人，用說桎梏，以往吝。", "九二：包蒙吉，納婦吉，子克家。", "六三：勿用取女，見金夫，不有躬，无攸利。", "六四：困蒙，吝。", "六五：童蒙，吉。", "上九：擊蒙，不利為寇，利禦寇。"], "tuan": "蒙，山下有险，险而止，蒙。蒙亨，以亨行，时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。", "dx": "山下出泉，蒙；君子以果行育德。", "dxT": "山下出泉，蒙；君子以果行育德。", "xx": ["利用刑人，以正法也。", "子克家，刚柔接也。", "勿用取女，行不顺也。", "困蒙之吝，独远实也。", "童蒙之吉，顺以巽也。", "利御寇，上下顺也。"]}, {"n": 5, "name": "需", "nameT": "需", "down": "乾", "up": "坎", "gc": "有孚，光亨。贞吉，利涉大川。", "gcT": "有孚，光亨。貞吉，利涉大川。", "yao": ["初九：需于郊，利用恒，无咎。", "九二：需于沙，小有言，终吉。", "九三：需于泥，致寇至。", "六四：需于血，出自穴。", "九五：需于酒食，贞吉。", "上六：入于穴，有不速之客三人来，敬之终吉。"], "yaoT": ["初九：需于郊，利用恆，无咎。", "九二：需于沙，小有言，終吉。", "九三：需于泥，致寇至。", "六四：需于血，出自穴。", "九五：需于酒食，貞吉。", "上六：入于穴，有不速之客三人來，敬之終吉。"], "tuan": "需，须也，险在前也；刚健而不陷，其义不困穷矣。需，有孚，光亨，贞吉，位乎天位，以正中也。利涉大川，往有功也。", "dx": "云上于天，需；君子以饮食宴乐。", "dxT": "雲上於天，需；君子以飲食宴樂。", "xx": ["需于郊，不犯难行也。利用恒，无咎，未失常也。", "需于沙，衍在中也。虽小有言，以吉终也。", "需于泥，灾在外也。自我致寇，敬慎不败也。", "需于血，顺以听也。", "酒食，贞吉，以中正也。", "不速之客来，敬之终吉。虽不当位，未大失也。"]}, {"n": 6, "name": "讼", "nameT": "訟", "down": "坎", "up": "乾", "gc": "有孚，窒，惕，中吉，终凶。利见大人，不利涉大川。", "gcT": "有孚，窒，惕，中吉，終凶。利見大人，不利涉大川。", "yao": ["初六：不永所事，小有言，终吉。", "九二：不克讼，归而逋，其邑人三百户无眚。", "六三：食旧德，贞厉，终吉。或从王事，无成。", "九四：不克讼，复即命渝，安贞吉。", "九五：讼，元吉。", "上九：或锡之鞶带，终朝三褫之。"], "yaoT": ["初六：不永所事，小有言，終吉。", "九二：不克訟，歸而逋，其邑人三百戶无眚。", "六三：食舊德，貞厲，終吉。或從王事，无成。", "九四：不克訟，復即命渝，安貞吉。", "九五：訟，元吉。", "上九：或錫之鞶帶，終朝三褫之。"], "tuan": "讼，上刚下险，险而健，讼。讼，有孚，窒，惕，中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。", "dx": "天与水违行，讼；君子以作事谋始。", "dxT": "天與水違行，訟；君子以作事謀始。", "xx": ["不永所事，讼不可长也。虽小有言，其辩明也。", "不克讼，归逋窜也。自下讼上，患至掇也。", "食旧德，从上吉也。", "复即命渝，安贞，不失也。", "讼，元吉，以中正也。", "以讼受服，亦不足敬也。"]}, {"n": 7, "name": "师", "nameT": "師", "down": "坎", "up": "坤", "gc": "贞丈人吉，无咎。", "gcT": "貞丈人吉，无咎。", "yao": ["初六：师出以律，否臧，凶。", "九二：在师中吉，无咎；王三锡命。", "六三：师或舆尸，凶。", "六四：师左次，无咎。", "六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。", "上六：大君有命，开国承家，小人勿用。"], "yaoT": ["初六：師出以律，否臧，凶。", "九二：在師中吉，无咎；王三錫命。", "六三：師或輿尸，凶。", "六四：師左次，无咎。", "六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。", "上六：大君有命，開國承家，小人勿用。"], "tuan": "师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺，以此毒天下，而民从之，吉又何咎矣。", "dx": "地中有水，师；君子以容民畜众。", "dxT": "地中有水，師；君子以容民畜衆。", "xx": ["师出以律；失律，凶也。", "在师中吉，承天宠也。王三锡命，怀万邦也。", "师或舆尸，大无功也。", "左次无咎，未失常也。", "长子帅师，以中行也。弟子舆尸，使不当也。", "大君有命，以正功也。小人勿用，必乱邦也。"]}, {"n": 8, "name": "比", "nameT": "比", "down": "坤", "up": "坎", "gc": "吉。原筮元永贞，无咎。不宁方来，后夫凶。", "gcT": "吉。原筮元永貞，无咎。不寧方來，後夫凶。", "yao": ["初六：有孚，比之，无咎。有孚盈缶，终来有它，吉。", "六二：比之自内，贞吉。", "六三：比之匪人。", "六四：外比之，贞吉。", "九五：显比。王用三驱，失前禽，邑人不诫，吉。", "上六：比之无首，凶。"], "yaoT": ["初六：有孚，比之，无咎。有孚盈缶，終來有它，吉。", "六二：比之自內，貞吉。", "六三：比之匪人。", "六四：外比之，貞吉。", "九五：顯比。王用三驅，失前禽，邑人不誡，吉。", "上六：比之无首，凶。"], "tuan": "比，吉也。比，辅也，下顺从也。原筮，元永贞，无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。", "dx": "地上有水，比；先王以建万国，亲诸侯。", "dxT": "地上有水，比；先王以建萬國，親諸侯。", "xx": ["比之初六，有它吉也。", "比之自内，不自失也。", "比之匪人，不亦伤乎！", "外比于贤，以从上也。", "显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。", "比之无首，无所终也。"]}, {"n": 9, "name": "小畜", "nameT": "小畜", "down": "乾", "up": "巽", "gc": "亨。密云不雨，自我西郊。", "gcT": "亨。密雲不雨，自我西郊。", "yao": ["初九：复自道，何其咎，吉。", "九二：牵复，吉。", "九三：舆说辐，夫妻反目。", "六四：有孚，血去惕出，无咎。", "九五：有孚挛如，富以其邻。", "上九：既雨既处，尚德载，妇贞厉，月几望，君子征凶。"], "yaoT": ["初九：復自道，何其咎，吉。", "九二：牽復，吉。", "九三：輿說輻，夫妻反目。", "六四：有孚，血去惕出，无咎。", "九五：有孚攣如，富以其鄰。", "上九：既雨既處，尚德載，婦貞厲，月幾望，君子征凶。"], "tuan": "小畜，柔得位而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。", "dx": "风行天上，小畜，君子以懿文德。", "dxT": "風行天上，小畜，君子以懿文德。", "xx": ["复自道，其义吉也。", "牵复在中，亦不自失也。", "夫妻反目，不能正室也。", "有孚。惕出。上合志也。", "有孚挛如，不独富也。", "既雨既处，德积载也。君子征凶，有所疑也。"]}, {"n": 10, "name": "履", "nameT": "履", "down": "兑", "up": "乾", "gc": "履虎尾，不咥人，亨。", "gcT": "履虎尾，不咥人，亨。", "yao": ["初九：素履，往无咎。", "九二：履道坦坦，幽人贞吉。", "六三：眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。", "九四：履虎尾，愬愬终吉。", "九五：夬履，贞厉。", "上九：视履考详，其旋元吉。"], "yaoT": ["初九：素履，往无咎。", "九二：履道坦坦，幽人貞吉。", "六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。", "九四：履虎尾，愬愬終吉。", "九五：夬履，貞厲。", "上九：視履考詳，其旋元吉。"], "tuan": "履，柔履刚也。说而应乎乾，是以履虎尾，不咥人，亨，利贞。刚中正，履帝位而不疚，光明也。", "dx": "上天下泽，履；君子以辨上下，定民志。", "dxT": "上天下澤，履；君子以辨上下，定民志。", "xx": ["素履之往，独行愿也。", "幽人贞吉，中不自乱也。", "眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。", "愬愬终吉，志行也。", "夬履贞厉，位正当也。", "元吉在上，大有庆也。"]}, {"n": 11, "name": "泰", "nameT": "泰", "down": "乾", "up": "坤", "gc": "小往大来，吉亨。", "gcT": "小往大來，吉亨。", "yao": ["初九：拔茅茹以其汇，征吉。", "九二：包荒。用冯河，不遐遗；朋亡。得尚于中行。", "九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。", "六四：翩翩，不富以其邻；不戒以孚。", "六五：帝乙归妹，以祉，元吉。", "上六：城复于隍，勿用师，自邑告命，贞吝。"], "yaoT": ["初九：拔茅茹以其彙，征吉。", "九二：包荒。用馮河，不遐遺；朋亡。得尚于中行。", "九三：无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。", "六四：翩翩，不富以其鄰；不戒以孚。", "六五：帝乙歸妹，以祉，元吉。", "上六：城復于隍，勿用師，自邑告命，貞吝。"], "tuan": "泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。", "dx": "天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。", "dxT": "天地交，泰；后以財成天地之道，輔相天地之宜，以左右民。", "xx": ["拔茅征吉，志在外也。", "包荒，得尚于中行，以光大也。", "无往不复，天地际也。", "翩翩不富，皆失实也。不戒以孚，中心愿也。", "以祉，元吉。中以行愿也。", "城复于隍，其命乱也。"]}, {"n": 12, "name": "否", "nameT": "否", "down": "坤", "up": "乾", "gc": "否之匪人，不利君子贞，大往小来。", "gcT": "否之匪人，不利君子貞，大往小來。", "yao": ["初六，拔茅茹以其汇，贞吉。亨。", "六二，包承，小人吉，大人否。亨。", "六三，包羞。", "九四，有命，无咎，畴离祉。", "九五，休否，大人吉。其亡其亡，系于苞桑。", "上九，倾否，先否后喜。"], "yaoT": ["初六，拔茅茹以其彙，貞吉。亨。", "六二，包承，小人吉，大人否。亨。", "六三，包羞。", "九四，有命，无咎，疇離祉。", "九五，休否，大人吉。其亡其亡，繫于苞桑。", "上九，傾否，先否後喜。"], "tuan": "否之匪人，不利君子贞，大往小来。则是天地不交而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。", "dx": "天地不交，否；君子以俭德辟难，不可荣以禄。", "dxT": "天地不交，否；君子以儉德辟難，不可榮以祿。", "xx": ["拔茅贞吉，志在君也。", "大人否，亨。不乱群也。", "包羞，位不当也。", "有命无咎，志行也。", "大人之吉，位正当也。", "否终则倾，何可长也。"]}, {"n": 13, "name": "同人", "nameT": "同人", "down": "离", "up": "乾", "gc": "同人于野，亨。 利涉大川，利君子贞。", "gcT": "同人于野，亨。 利涉大川，利君子貞。", "yao": ["初九：同人于门，无咎。", "六二：同人于宗，吝。", "九三：伏戎于莽，升其高陵，三岁不兴。", "九四：乘其墉，弗克攻，吉。", "九五：同人，先号啕而后笑。大师克相遇。", "上九：同人于郊，无悔。"], "yaoT": ["初九：同人于門，無咎。", "六二：同人于宗，吝。", "九三：伏戎于莽，升其高陵，三歲不興。", "九四：乘其墉，弗克攻，吉。", "九五：同人，先號啕而後笑。大師克相遇。", "上九：同人于郊，無悔。"], "tuan": "同人，柔得位得中，而应乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。", "dx": "天与火，同人；君子以类族辨物。", "dxT": "天與火，同人；君子以類族辨物。", "xx": ["出门同人，又谁咎也。", "同人于宗，吝道也。", "伏戎于莽，敌刚也。三岁不兴，安行也。", "乘其墉，义弗克也，其吉，则困而反则也。", "同人之先，以中直也。大师相遇，言相克也。", "同人于郊，志未得也。"]}, {"n": 14, "name": "大有", "nameT": "大有", "down": "乾", "up": "离", "gc": "元亨。", "gcT": "元亨。", "yao": ["初九：无交害，匪咎，艰则无咎。", "九二：大车以载，有攸往，无咎。", "九三：公用亨于天子，小人弗克。", "九四：匪其彭，无咎。", "六五：厥孚交如，威如；吉。", "上九：自天右之，吉无不利。"], "yaoT": ["初九：无交害，匪咎，艱則无咎。", "九二：大車以載，有攸往，无咎。", "九三：公用亨于天子，小人弗克。", "九四：匪其彭，无咎。", "六五：厥孚交如，威如；吉。", "上九：自天右之，吉无不利。"], "tuan": "大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。", "dx": "火在天上，大有；君子以遏恶扬善，顺天休命。", "dxT": "火在天上，大有；君子以遏惡揚善，順天休命。", "xx": ["大有初九，无交害也。", "大车以载，积中不败也。", "公用亨于天子，小人害也。", "匪其彭，无咎；明辨晰也。", "厥孚交如，信以发志也。威如之吉，易而无备也。", "大有上吉，自天佑也。"]}, {"n": 15, "name": "谦", "nameT": "謙", "down": "艮", "up": "坤", "gc": "亨，君子有终。", "gcT": "亨，君子有終。", "yao": ["初六：谦谦君子，用涉大川，吉。", "六二：鸣谦，贞吉。", "九三：劳谦君子，有终吉。", "六四：无不利，㧑谦。", "六五：不富，以其邻，利用侵伐，无不利。", "上六：鸣谦，利用行师，征邑国。"], "yaoT": ["初六：謙謙君子，用涉大川，吉。", "六二：鳴謙，貞吉。", "九三：勞謙君子，有終吉。", "六四：无不利，撝謙。", "六五：不富，以其鄰，利用侵伐，无不利。", "上六：鳴謙，利用行師，征邑國。"], "tuan": "谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。", "dx": "地中有山，谦；君子以裒多益寡，称物平施。", "dxT": "地中有山，謙；君子以裒多益寡，稱物平施。", "xx": ["谦谦君子，卑以自牧也。", "鸣谦贞吉，中心得也。", "劳谦君子，万民服也。", "无不利㧑谦；不违则也。", "利用侵伐，征不服也。", "鸣谦，志未得也。可用行师，征邑国也。"]}, {"n": 16, "name": "豫", "nameT": "豫", "down": "坤", "up": "震", "gc": "利建侯行师。", "gcT": "利建侯行師。", "yao": ["初六：鸣豫，凶。", "六二：介于石，不终日，贞吉。", "六三：盱豫，悔。迟有悔。", "九四：由豫，大有得。勿疑。朋盍簪。", "六五：贞疾，恒不死。", "上六：冥豫，成有渝，无咎。"], "yaoT": ["初六：鳴豫，凶。", "六二：介于石，不終日，貞吉。", "六三：盱豫，悔。遲有悔。", "九四：由豫，大有得。勿疑。朋盍簪。", "六五：貞疾，恆不死。", "上六：冥豫，成有渝，无咎。"], "tuan": "豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！", "dx": "雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。", "dxT": "雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。", "xx": ["初六鸣豫，志穷凶也。", "不终日，贞吉；以中正也。", "盱豫有悔，位不当也。", "由豫，大有得；志大行也。", "六五贞疾，乘刚也。恒不死，中未亡也。", "冥豫在上，何可长也。"]}, {"n": 17, "name": "随", "nameT": "隨", "down": "震", "up": "兑", "gc": "元亨。利贞。无咎。", "gcT": "元亨。利貞。无咎。", "yao": ["初九：官有渝，贞吉。出门交有功。", "六二：系小子，失丈夫。", "六三：系丈夫，失小子。随，有求得利，居贞。", "九四：随有获，贞凶。有孚在道，以明，何咎。", "九五：孚于嘉，吉。", "上六：拘系之，乃从维之。王用亨于西山。"], "yaoT": ["初九：官有渝，貞吉。出門交有功。", "六二：係小子，失丈夫。", "六三：係丈夫，失小子。隨，有求得利，居貞。", "九四：隨有獲，貞凶。有孚在道，以明，何咎。", "九五：孚于嘉，吉。", "上六：拘係之，乃從維之。王用亨于西山。"], "tuan": "随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随时之义大矣哉！", "dx": "泽中有雷，随；君子以向晦入宴息。", "dxT": "澤中有雷，隨；君子以嚮晦入宴息。", "xx": ["官有渝，从正吉也。出门交有功，不失也。", "系小子，弗兼与也。", "系丈夫，志舍下也。", "随有获，其义凶也。有孚在道，明功也。", "孚于嘉，吉；位正中也。", "拘系之，上穷也。"]}, {"n": 18, "name": "蛊", "nameT": "蠱", "down": "巽", "up": "艮", "gc": "元亨。利涉大川。先甲三日，后甲三日。", "gcT": "元亨。利涉大川。先甲三日，後甲三日。", "yao": ["初六：干父之蛊，有子考，无咎，厉终吉。", "九二：干母之蛊，不可贞。", "九三：干父之蛊，小有悔，无大咎。", "六四：裕父之蛊，往见吝。", "六五：干父之蛊，用誉。", "上九：不事王侯，高尚其事。"], "yaoT": ["初六：幹父之蠱，有子考，无咎，厲終吉。", "九二：幹母之蠱，不可貞。", "九三：幹父之蠱，小有悔，无大咎。", "六四：裕父之蠱，往見吝。", "六五：幹父之蠱，用譽。", "上九：不事王侯，高尚其事。"], "tuan": "蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。", "dx": "山下有风，蛊；君子以振民育德。", "dxT": "山下有風，蠱；君子以振民育德。", "xx": ["干父之蛊，意承考也。", "干母之蛊，得中道也。", "干父之蛊，终无咎也。", "裕父之蛊，往未得也。", "干父用誉，承以德也。", "不事王侯，志可则也。"]}, {"n": 19, "name": "临", "nameT": "臨", "down": "兑", "up": "坤", "gc": "元亨。利贞。至于八月有凶。", "gcT": "元亨。利貞。至于八月有凶。", "yao": ["初九：咸临，贞吉。", "九二：咸临，吉无不利。", "六三：甘临，无攸利。既忧之，无咎。", "六四：至临，无咎。", "六五：知临，大君之宜，吉。", "上六：敦临，吉无咎。"], "yaoT": ["初九：咸臨，貞吉。", "九二：咸臨，吉无不利。", "六三：甘臨，无攸利。既憂之，无咎。", "六四：至臨，无咎。", "六五：知臨，大君之宜，吉。", "上六：敦臨，吉无咎。"], "tuan": "临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。", "dx": "泽上有地，临；君子以教思无穷，容保民无疆。", "dxT": "澤上有地，臨；君子以教思无窮，容保民无疆。", "xx": ["咸临贞吉，志行正也。", "咸临，吉无不利；未顺命也。", "甘临，位不当也。既忧之，咎不长也。", "至临无咎，位当也。", "大君之宜，行中之谓也。", "敦临之吉，志在内也。"]}, {"n": 20, "name": "观", "nameT": "觀", "down": "坤", "up": "巽", "gc": "盥而不荐，有孚颙若。", "gcT": "盥而不薦，有孚顒若。", "yao": ["初六：童观，小人无咎，君子吝。", "六二：窥观，利女贞。", "六三：观我生，进退。", "六四：观国之光，利用宾于王。", "九五：观我生，君子无咎。", "上九：观其生，君子无咎。"], "yaoT": ["初六：童觀，小人无咎，君子吝。", "六二：窺觀，利女貞。", "六三：觀我生，進退。", "六四：觀國之光，利用賓于王。", "九五：觀我生，君子无咎。", "上九：觀其生，君子无咎。"], "tuan": "大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。", "dx": "风行地上，观；先王以省方，观民设教。", "dxT": "風行地上，觀；先王以省方，觀民設教。", "xx": ["初六童观，小人道也。", "窥观女贞，亦可丑也。", "观我生，进退；未失道也。", "观国之光，尚宾也。", "观我生，观民也。", "观其生，志未平也。"]}, {"n": 21, "name": "噬嗑", "nameT": "噬嗑", "down": "震", "up": "离", "gc": "亨。利用狱。", "gcT": "亨。利用獄。", "yao": ["初九：屦校灭趾，无咎。", "六二：噬肤灭鼻，无咎。", "六三：噬腊肉，遇毒；小吝，无咎。", "九四：噬乾胏，得金矢，利艰贞，吉。", "六五：噬乾肉，得黄金，贞厉，无咎。", "上九：何校灭耳，凶。"], "yaoT": ["初九：屨校滅趾，无咎。", "六二：噬膚滅鼻，无咎。", "六三：噬臘肉，遇毒；小吝，无咎。", "九四：噬乾胏，得金矢，利艱貞，吉。", "六五：噬乾肉，得黃金，貞厲，无咎。", "上九：何校滅耳，凶。"], "tuan": "颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。", "dx": "雷电噬嗑；先王以明罚敕法。", "dxT": "雷電噬嗑；先王以明罰敕法。", "xx": ["屦校灭趾，不行也。", "噬肤灭鼻，乘刚也。", "遇毒，位不当也。", "利艰贞吉，未光也。", "贞厉无咎，得当也。", "何校灭耳，聪不明也。"]}, {"n": 22, "name": "贲", "nameT": "賁", "down": "离", "up": "艮", "gc": "亨。小利有攸往。", "gcT": "亨。小利有攸往。", "yao": ["初九：贲其趾，舍车而徒。", "六二：贲其须。", "九三：贲如濡如，永贞吉。", "六四：贲如皤如，白马翰如，匪寇婚媾。", "六五：贲于丘园，束帛戋戋，吝，终吉。", "上九：白贲，无咎。"], "yaoT": ["初九：賁其趾，舍車而徒。", "六二：賁其須。", "九三：賁如濡如，永貞吉。", "六四：賁如皤如，白馬翰如，匪寇婚媾。", "六五：賁於丘園，束帛戔戔，吝，終吉。", "上九：白賁，无咎。"], "tuan": "贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。刚柔交错，天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。", "dx": "山下有火，贲；君子以明庶政，无敢折狱。", "dxT": "山下有火，賁；君子以明庶政，无敢折獄。", "xx": ["舍车而徒，义弗乘也。", "贲其须，与上兴也。", "永贞之吉，终莫之陵也。", "六四，当位疑也。匪寇婚媾，终无尤也。", "六五之吉，有喜也。", "白贲无咎，上得志也。"]}, {"n": 23, "name": "剥", "nameT": "剝", "down": "坤", "up": "艮", "gc": "不利。有攸往。", "gcT": "不利。有攸往。", "yao": ["初六：剥床以足，蔑贞凶。", "六二：剥床以辨，蔑贞凶。", "六三：剥之，无咎。", "六四：剥床以肤，凶。", "六五：贯鱼，以宫人宠，无不利。", "上九：硕果不食，君子得舆，小人剥庐。"], "yaoT": ["初六：剝牀以足，蔑貞凶。", "六二：剝牀以辨，蔑貞凶。", "六三：剝之，无咎。", "六四：剝牀以膚，凶。", "六五：貫魚，以宮人寵，无不利。", "上九：碩果不食，君子得輿，小人剝廬。"], "tuan": "剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。", "dx": "山附地上，剥；上以厚下，安宅。", "dxT": "山附地上，剝；上以厚下，安宅。", "xx": ["剥床以足，以灭下也。", "剥床以辨，未有与也。", "剥之无咎，失上下也。", "剥床以肤，切近灾也。", "以宫人宠，终无尤也。", "君子得舆，民所载也。小人剥庐，终不可用也。"]}, {"n": 24, "name": "复", "nameT": "復", "down": "震", "up": "坤", "gc": "亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。", "gcT": "亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。", "yao": ["初九：不远复，无祇悔，元吉。", "六二：休复，吉。", "六三：频复，厉无咎。", "六四：中行独复。", "六五：敦复，无悔。", "上六：迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。"], "yaoT": ["初九：不遠復，无祇悔，元吉。", "六二：休復，吉。", "六三：頻復，厲无咎。", "六四：中行獨復。", "六五：敦復，无悔。", "上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。"], "tuan": "复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？", "dx": "雷在地中，复；先王以至日闭关，商旅不行，后不省方。", "dxT": "雷在地中，復；先王以至日閉關，商旅不行，后不省方。", "xx": ["不远之复，以修身也。", "休复之吉，以下仁也。", "频复之厉，义无咎也。", "中行独复，以从道也。", "敦复无悔，中以自考也。", "迷复之凶，反君道也。"]}, {"n": 25, "name": "无妄", "nameT": "无妄", "down": "震", "up": "乾", "gc": "元亨。利贞。其匪正有眚，不利有攸往。", "gcT": "元亨。利貞。其匪正有眚，不利有攸往。", "yao": ["初九：无妄，往吉。", "六二：不耕获，不菑畬，则利有攸往。", "六三：无妄之灾，或系之牛，行人之得，邑人之灾。", "九四：可贞，无咎。", "九五：无妄之疾，勿药有喜。", "上九：无妄，行有眚，无攸利。"], "yaoT": ["初九：无妄，往吉。", "六二：不耕穫，不菑畬，則利有攸往。", "六三：无妄之災，或繫之牛，行人之得，邑人之災。", "九四：可貞，无咎。", "九五：无妄之疾，勿藥有喜。", "上九：无妄，行有眚，无攸利。"], "tuan": "无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？ 天命不佑，行矣哉？", "dx": "天下雷行，物与无妄；先王以茂对时，育万物。", "dxT": "天下雷行，物與无妄；先王以茂對時，育萬物。", "xx": ["无妄之往，得志也。", "不耕获，未富也。", "行人得牛，邑人灾也。", "可贞无咎，固有之也。", "无妄之药，不可试也。", "无妄之行，穷之灾也。"]}, {"n": 26, "name": "大畜", "nameT": "大畜", "down": "乾", "up": "艮", "gc": "利贞，不家食吉，利涉大川。", "gcT": "利貞，不家食吉，利涉大川。", "yao": ["初九：有厉利已。", "九二：舆说輹。", "九三：良马逐，利艰贞，吉。日闲舆卫，利有攸往。", "六四：童牛之牿，元吉。", "六五：豮豕之牙，吉。", "上九：何天之衢，亨。"], "yaoT": ["初九：有厲利已。", "九二：輿說輹。", "九三：良馬逐，利艱貞，吉。日閑輿衛，利有攸往。", "六四：童牛之牿，元吉。", "六五：豶豕之牙，吉。", "上九：何天之衢，亨。"], "tuan": "大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。", "dx": "天在山中，大畜；君子以多识前言往行，以畜其德。", "dxT": "天在山中，大畜；君子以多識前言往行，以畜其德。", "xx": ["有厉利已，不犯灾也。", "舆说輹，中无尤也。", "利有攸往，上合志也。", "六四元吉，有喜也。", "六五之吉，有庆也。", "何天之衢，道大行也。"]}, {"n": 27, "name": "颐", "nameT": "頤", "down": "震", "up": "艮", "gc": "贞吉。观颐，自求口实。", "gcT": "貞吉。觀頤，自求口實。", "yao": ["初九：舍尔灵龟，观我朵颐，凶。", "六二：颠颐，拂经，于丘颐，征凶。", "六三：拂颐，贞凶，十年勿用，无攸利。", "六四：颠颐吉，虎视眈眈，其欲逐逐，无咎。", "六五：拂经，居贞吉，不可涉大川。", "上九：由颐，厉吉，利涉大川。"], "yaoT": ["初九：舍爾靈龜，觀我朵頤，凶。", "六二：顛頤，拂經，于丘頤，征凶。", "六三：拂頤，貞凶，十年勿用，无攸利。", "六四：顛頤吉，虎視眈眈，其欲逐逐，无咎。", "六五：拂經，居貞吉，不可涉大川。", "上九：由頤，厲吉，利涉大川。"], "tuan": "颐贞吉，养正则吉也。观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤，以及万民；颐之时大矣哉！", "dx": "山下有雷，颐；君子以慎言语，节饮食。", "dxT": "山下有雷，頤；君子以慎言語，節飲食。", "xx": ["观我朵颐，亦不足贵也。", "六二征凶，行失类也。", "十年勿用，道大悖也。", "颠颐之吉，上施光也。", "居贞之吉，顺以从上也。", "由颐厉吉，大有庆也。"]}, {"n": 28, "name": "大过", "nameT": "大過", "down": "巽", "up": "兑", "gc": "栋桡，利有攸往，亨。", "gcT": "棟橈，利有攸往，亨。", "yao": ["初六：藉用白茅，无咎。", "九二：枯杨生稊，老夫得其女妻，无不利。", "九三：栋桡，凶。", "九四：栋隆，吉。有它吝。", "九五：枯杨生华，老妇得其士夫，无咎无誉。", "上六：过涉灭顶，凶，无咎。"], "yaoT": ["初六：藉用白茅，无咎。", "九二：枯楊生稊，老夫得其女妻，无不利。", "九三：棟橈，凶。", "九四：棟隆，吉。有它吝。", "九五：枯楊生華，老婦得其士夫，无咎无譽。", "上六：過涉滅頂，凶，无咎。"], "tuan": "大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时大矣哉！", "dx": "泽灭木，大过。君子以独立不惧，遯世无闷。", "dxT": "澤滅木，大過。君子以獨立不懼，遯世无悶。", "xx": ["藉用白茅，柔在下也。", "老夫女妻，过以相与也。", "栋桡之凶，不可以有辅也。", "栋隆之吉，不桡乎下也。", "枯杨生华，何可久也。老妇士夫，亦可丑也。", "过涉之凶，不可咎也。"]}, {"n": 29, "name": "坎", "nameT": "坎", "down": "坎", "up": "坎", "gc": "有孚，维心亨。行有尚。", "gcT": "有孚，維心亨。行有尚。", "yao": ["初六：习坎，入于坎窞，凶。", "九二：坎有险，求小得。", "六三：来之坎坎，险且枕，入于坎窞，勿用。", "六四：樽酒簋贰，用缶，纳约自牖，终无咎。", "九五：坎不盈，祗既平，无咎。", "上六：系用徽𬙊，寘于丛棘，三岁不得，凶。"], "yaoT": ["初六：習坎，入于坎窞，凶。", "九二：坎有險，求小得。", "六三：來之坎坎，險且枕，入于坎窞，勿用。", "六四：樽酒簋貳，用缶，納約自牖，終无咎。", "九五：坎不盈，祗既平，无咎。", "上六：係用徽纆，寘于叢棘，三歲不得，凶。"], "tuan": "习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，坎之时用大矣哉！", "dx": "水洊至，习坎；君子以常德行，习教事。", "dxT": "水洊至，習坎；君子以常德行，習教事。", "xx": ["习坎入坎，失道凶也。", "求小得，未出中也。", "来之坎坎，终无功也。", "樽酒簋贰，刚柔济也。", "坎不盈，中未大也。", "上六失道，凶三岁也。"]}, {"n": 30, "name": "离", "nameT": "離", "down": "离", "up": "离", "gc": "利贞。亨。畜牝牛，吉。", "gcT": "利貞。亨。畜牝牛，吉。", "yao": ["初九：履错然，敬之无咎。", "六二：黄离，元吉。", "九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。", "九四：突如其来如，焚如，死如，弃如。", "六五：出涕沱若，戚嗟若，吉。", "上九：王用出征，有嘉折首，获匪其丑，无咎。"], "yaoT": ["初九：履錯然，敬之无咎。", "六二：黃離，元吉。", "九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。", "九四：突如其來如，焚如，死如，棄如。", "六五：出涕沱若，戚嗟若，吉。", "上九：王用出征，有嘉折首，獲匪其醜，无咎。"], "tuan": "离，丽也；日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故亨；是以畜牝牛吉也。", "dx": "明两作离，大人以继明照于四方。", "dxT": "明兩作離，大人以繼明照于四方。", "xx": ["履错之敬，以辟咎也。", "黄离元吉，得中道也。", "日昃之离，何可久也。", "突如其来如，无所容也。", "六五之吉，离王公也。", "王用出征，以正邦也。"]}, {"n": 31, "name": "咸", "nameT": "咸", "down": "艮", "up": "兑", "gc": "亨。利贞。取女吉。", "gcT": "亨。利貞。取女吉。", "yao": ["初六：咸其拇。", "六二：咸其腓，凶，居吉。", "九三：咸其股，执其随，往吝。", "九四：贞吉悔亡，憧憧往来，朋从尔思。", "九五：咸其脢，无悔。", "上六：咸其辅，颊，舌。"], "yaoT": ["初六：咸其拇。", "六二：咸其腓，凶，居吉。", "九三：咸其股，執其隨，往吝。", "九四：貞吉悔亡，憧憧往來，朋從爾思。", "九五：咸其脢，无悔。", "上六：咸其輔，頰，舌。"], "tuan": "咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平；观其所感，而天地万物之情可见矣！", "dx": "山上有泽，咸；君子以虚受人。", "dxT": "山上有澤，咸；君子以虛受人。", "xx": ["咸其拇，志在外也。", "虽凶，居吉，顺不害也。", "咸其股，亦不处也。志在随人，所执下也。", "贞吉悔亡，未感害也。憧憧往来，未光大也。", "咸其脢，志末也。", "咸其辅，颊，舌，滕口说也。"]}, {"n": 32, "name": "恒", "nameT": "恆", "down": "巽", "up": "震", "gc": "亨，无咎。利贞，利有攸往。", "gcT": "亨，无咎。利貞，利有攸往。", "yao": ["初六：浚恒，贞凶，无攸利。", "九二：悔亡。", "九三：不恒其德，或承之羞，贞吝。", "九四：田无禽。", "六五：恒其德，贞，妇人吉，夫子凶。", "上六：振恒，凶。"], "yaoT": ["初六：浚恆，貞凶，无攸利。", "九二：悔亡。", "九三：不恆其德，或承之羞，貞吝。", "九四：田无禽。", "六五：恆其德，貞，婦人吉，夫子凶。", "上六：振恆，凶。"], "tuan": "恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞；久于其道也，天地之道，恒久而不已也。利有攸往，终则有始也。日月得天，而能久照，四时变化，而能久成，圣人久于其道，而天下化成；观其所恒，而天地万物之情可见矣！", "dx": "雷风，恒；君子以立不易方。", "dxT": "雷風，恆；君子以立不易方。", "xx": ["浚恒之凶，始求深也。", "九二悔亡，能久中也。", "不恒其德，无所容也。", "久非其位，安得禽也。", "妇人贞吉，从一而终也。夫子制义，从妇凶也。", "振恒在上，大无功也。"]}, {"n": 33, "name": "遯", "nameT": "遯", "down": "艮", "up": "乾", "gc": "亨。小利贞。", "gcT": "亨。小利貞。", "yao": ["初六：遯尾，厉，勿用有攸往。", "六二：执之用黄牛之革，莫之胜说。", "九三：系遯，有疾厉，畜臣妾吉。", "九四：好遯君子吉，小人否。", "九五：嘉遯，贞吉。", "上九：肥遯，无不利。"], "yaoT": ["初六：遯尾，厲，勿用有攸往。", "六二：執之用黃牛之革，莫之勝說。", "九三：係遯，有疾厲，畜臣妾吉。", "九四：好遯君子吉，小人否。", "九五：嘉遯，貞吉。", "上九：肥遯，无不利。"], "tuan": "遯亨，遯而亨也。刚当位而应，与时行也。小利贞，浸而长也。遯之时义大矣哉！", "dx": "天下有山，遯；君子以远小人，不恶而严。", "dxT": "天下有山，遯；君子以遠小人，不惡而嚴。", "xx": ["遯尾之厉，不往何灾也。", "执用黄牛，固志也。", "系遯之厉，有疾惫也。畜臣妾吉，不可大事也。", "君子好遯，小人否也。", "嘉遯贞吉，以正志也。", "肥遯，无不利；无所疑也。"]}, {"n": 34, "name": "大壮", "nameT": "大壯", "down": "乾", "up": "震", "gc": "利贞。", "gcT": "利貞。", "yao": ["初九：壮于趾，征凶，有孚。", "九二：贞吉。", "九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。", "九四：贞吉悔亡，藩决不羸，壮于大舆之輹。", "六五：丧羊于易，无悔。", "上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。"], "yaoT": ["初九：壯于趾，征凶，有孚。", "九二：貞吉。", "九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。", "九四：貞吉悔亡，藩決不羸，壯于大輿之輹。", "六五：喪羊于易，无悔。", "上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。"], "tuan": "大壮，大者壮也。刚以动，故壮。大壮利贞；大者正也。正大而天地之情可见矣！", "dx": "雷在天上，大壮；君子以非礼弗履。", "dxT": "雷在天上，大壯；君子以非禮弗履。", "xx": ["壮于趾，其孚穷也。", "九二贞吉，以中也。", "小人用壮，君子罔也。", "藩决不羸，尚往也。", "丧羊于易，位不当也。", "不能退，不能遂，不详也。艰则吉，咎不长也。"]}, {"n": 35, "name": "晋", "nameT": "晉", "down": "坤", "up": "离", "gc": "康侯用锡马蕃庶，昼日三接。", "gcT": "康侯用錫馬蕃庶，晝日三接。", "yao": ["初六：晋如，摧如，贞吉。罔孚，裕无咎。", "六二：晋如，愁如，贞吉。受兹介福，于其王母。", "六三：众允，悔亡。", "九四：晋如鼫鼠，贞厉。", "六五：悔亡，失得勿恤，往吉无不利。", "上九：晋其角，维用伐邑，厉吉无咎，贞吝。"], "yaoT": ["初六：晉如，摧如，貞吉。罔孚，裕无咎。", "六二：晉如，愁如，貞吉。受茲介福，于其王母。", "六三：眾允，悔亡。", "九四：晉如鼫鼠，貞厲。", "六五：悔亡，失得勿恤，往吉无不利。", "上九：晉其角，維用伐邑，厲吉无咎，貞吝。"], "tuan": "晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。", "dx": "明出地上，晋；君子以自昭明德。", "dxT": "明出地上，晉；君子以自昭明德。", "xx": ["晋如，摧如；独行正也。裕无咎；未受命也。", "受兹介福，以中正也。", "众允之志，上行也。", "鼫鼠贞厉，位不当也。", "失得勿恤，往有庆也。", "维用伐邑，道未光也。"]}, {"n": 36, "name": "明夷", "nameT": "明夷", "down": "离", "up": "坤", "gc": "利艰贞。", "gcT": "利艱貞。", "yao": ["初九：明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。", "六二：明夷，夷于左股，用拯马壮，吉。", "九三：明夷于南狩，得其大首，不可疾贞。", "六四：入于左腹，获明夷之心，于出门庭。", "六五：箕子之明夷，利贞。", "上六：不明晦，初登于天，后入于地。"], "yaoT": ["初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。", "六二：明夷，夷于左股，用拯馬壯，吉。", "九三：明夷于南狩，得其大首，不可疾貞。", "六四：入于左腹，獲明夷之心，于出門庭。", "六五：箕子之明夷，利貞。", "上六：不明晦，初登于天，後入于地。"], "tuan": "明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也，内难而能正其志，箕子以之。", "dx": "明入地中，明夷；君子以莅众，用晦而明。", "dxT": "明入地中，明夷；君子以蒞眾，用晦而明。", "xx": ["君子于行，义不食也。", "六二之吉，顺以则也。", "南狩之志，乃大得也。", "入于左腹，获心意也。", "箕子之贞，明不可息也。", "初登于天，照四国也。后入于地，失则也。"]}, {"n": 37, "name": "家人", "nameT": "家人", "down": "离", "up": "巽", "gc": "利女贞。", "gcT": "利女貞。", "yao": ["初九：闲有家，悔亡。", "六二：无攸遂，在中馈，贞吉。", "九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。", "六四：富家，大吉。", "九五：王假有家，勿恤。吉。", "上九：有孚威如，终吉。"], "yaoT": ["初九：閑有家，悔亡。", "六二：无攸遂，在中饋，貞吉。", "九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。", "六四：富家，大吉。", "九五：王假有家，勿恤。吉。", "上九：有孚威如，終吉。"], "tuan": "家人，女正位乎内，男正位乎外，男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正；正家而天下定矣。", "dx": "风自火出，家人；君子以言有物，而行有恒。", "dxT": "風自火出，家人；君子以言有物，而行有恆。", "xx": ["闲有家，志未变也。", "六二之吉，顺以巽也。", "家人嗃嗃，未失也；妇子嘻嘻，失家节也。", "富家大吉，顺在位也。", "王假有家，交相爱也。", "威如之吉，反身之谓也。"]}, {"n": 38, "name": "睽", "nameT": "睽", "down": "兑", "up": "离", "gc": "小事吉。", "gcT": "小事吉。", "yao": ["初九：悔亡，丧马勿逐，自复；见恶人无咎。", "九二：遇主于巷，无咎。", "六三：见舆曳，其牛掣，其人天且劓，无初有终。", "九四：睽孤，遇元夫，交孚，厉无咎。", "六五：悔亡，厥宗噬肤，往何咎。", "上九：睽孤， 见豕负涂，载鬼一车， 先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"], "yaoT": ["初九：悔亡，喪馬勿逐，自復；見惡人无咎。", "九二：遇主于巷，无咎。", "六三：見輿曳，其牛掣，其人天且劓，无初有終。", "九四：睽孤，遇元夫，交孚，厲无咎。", "六五：悔亡，厥宗噬膚，往何咎。", "上九：睽孤， 見豕負涂，載鬼一車， 先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。"], "tuan": "睽，火动而上，泽动而下；二女同居，其志不同行；说而丽乎明，柔进而上行，得中而应乎刚；是以小事吉。天地睽，而其事同也；男女睽，而其志通也；万物睽，而其事类也；睽之时用大矣哉！", "dx": "上火下泽，睽；君子以同而异。", "dxT": "上火下澤，睽；君子以同而異。", "xx": ["见恶人，以辟咎也。", "遇主于巷，未失道也。", "见舆曳，位不当也。无初有终，遇刚也。", "交孚无咎，志行也。", "厥宗噬肤，往有庆也。", "遇雨之吉，群疑亡也。"]}, {"n": 39, "name": "蹇", "nameT": "蹇", "down": "艮", "up": "坎", "gc": "利西南，不利东北；利见大人，贞吉。", "gcT": "利西南，不利東北；利見大人，貞吉。", "yao": ["初六：往蹇，来誉。", "六二：王臣蹇蹇，匪躬之故。", "九三：往蹇来反。", "六四：往蹇来连。", "九五：大蹇朋来。", "上六：往蹇来硕，吉；利见大人。"], "yaoT": ["初六：往蹇，來譽。", "六二：王臣蹇蹇，匪躬之故。", "九三：往蹇來反。", "六四：往蹇來連。", "九五：大蹇朋來。", "上六：往蹇來碩，吉；利見大人。"], "tuan": "蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也；不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！", "dx": "山上有水，蹇；君子以反身修德。", "dxT": "山上有水，蹇；君子以反身修德。", "xx": ["往蹇来誉，宜待也。", "王臣蹇蹇，终无尤也。", "往蹇来反，内喜之也。", "往蹇来连，当位实也。", "大蹇朋来，以中节也。", "往蹇来硕，志在内也。利见大人，以从贵也。"]}, {"n": 40, "name": "解", "nameT": "解", "down": "坎", "up": "震", "gc": "利西南，无所往，其来复吉。有攸往，夙吉。", "gcT": "利西南，无所往，其來復吉。有攸往，夙吉。", "yao": ["初六：无咎。", "九二：田获三狐，得黄矢，贞吉。", "六三：负且乘，致寇至，贞吝。", "九四：解而拇，朋至斯孚。", "六五：君子维有解，吉；有孚于小人。", "上六：公用射隼，于高墉之上，获之，无不利。"], "yaoT": ["初六：无咎。", "九二：田獲三狐，得黃矢，貞吉。", "六三：負且乘，致寇至，貞吝。", "九四：解而拇，朋至斯孚。", "六五：君子維有解，吉；有孚于小人。", "上六：公用射隼，于高墉之上，獲之，无不利。"], "tuan": "解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时义大矣哉！", "dx": "雷雨作，解；君子以赦过宥罪。", "dxT": "雷雨作，解；君子以赦過宥罪。", "xx": ["刚柔之际，义无咎也。", "九二贞吉，得中道也。", "负且乘，亦可丑也，自我致戎，又谁咎也。", "解而拇，未当位也。", "君子有解，小人退也。", "公用射隼，以解悖也。"]}, {"n": 41, "name": "损", "nameT": "損", "down": "兑", "up": "艮", "gc": "有孚，元吉。无咎，可贞，利有攸往。曷之用？二簋可用享。", "gcT": "有孚，元吉。无咎，可貞，利有攸往。曷之用？二簋可用享。", "yao": ["初九：已事遄往，无咎，酌损之。", "九二：利贞，征凶，弗损益之。", "六三：三人行，则损一人；一人行，则得其友。", "六四：损其疾，使遄有喜，无咎。", "六五：或益之，十朋之龟弗克违，元吉。", "上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。"], "yaoT": ["初九：已事遄往，无咎，酌損之。", "九二：利貞，征凶，弗損益之。", "六三：三人行，則損一人；一人行，則得其友。", "六四：損其疾，使遄有喜，无咎。", "六五：或益之，十朋之龜弗克違，元吉。", "上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。"], "tuan": "损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享；二簋应有时。损刚益柔有时，损益盈虚，与时偕行。", "dx": "山下有泽，损；君子以惩忿窒欲。", "dxT": "山下有澤，損；君子以懲忿窒欲。", "xx": ["已事遄往，尚合志也。", "九二利贞，中以为志也。", "一人行，三则疑也。", "损其疾，亦可喜也。", "六五元吉，自上佑也。", "弗损益之，大得志也。"]}, {"n": 42, "name": "益", "nameT": "益", "down": "震", "up": "巽", "gc": "利有攸往。利涉大川。", "gcT": "利有攸往。利涉大川。", "yao": ["初九：利用为大作，元吉，无咎。", "六二：或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。", "六三：益之用凶事，无咎。有孚中行，告公用圭。", "六四：中行，告公从。利用为依迁国。", "九五：有孚惠心，勿问元吉。有孚惠我德。", "上九：莫益之，或击之，立心勿恒，凶。"], "yaoT": ["初九：利用為大作，元吉，无咎。", "六二：或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。", "六三：益之用凶事，无咎。有孚中行，告公用圭。", "六四：中行，告公從。利用為依遷國。", "九五：有孚惠心，勿問元吉。有孚惠我德。", "上九：莫益之，或擊之，立心勿恆，凶。"], "tuan": "益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。", "dx": "风雷，益；君子以见善则迁，有过则改。", "dxT": "風雷，益；君子以見善則遷，有過則改。", "xx": ["元吉无咎，下不厚事也。", "或益之，自外来也。", "益用凶事，固有之也。", "告公从，以益志也。", "有孚惠心，勿问之矣。惠我德，大得志也。", "莫益之，偏辞也。或击之，自外来也。"]}, {"n": 43, "name": "夬", "nameT": "夬", "down": "乾", "up": "兑", "gc": "扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。", "gcT": "揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。", "yao": ["初九：壮于前趾，往不胜为咎。", "九二：惕号，莫夜有戎，勿恤。", "九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。", "九四：臀无肤，其行次且。牵羊悔亡，闻言不信。", "九五：苋陆夬夬，中行无咎。", "上六：无号，终有凶。"], "yaoT": ["初九：壯于前趾，往不勝為咎。", "九二：惕號，莫夜有戎，勿恤。", "九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。", "九四：臀无膚，其行次且。牽羊悔亡，聞言不信。", "九五：莧陸夬夬，中行无咎。", "上六：无號，終有凶。"], "tuan": "夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。", "dx": "泽上于天，夬；君子以施禄及下，居德则忌。", "dxT": "澤上于天，夬；君子以施祿及下，居德則忌。", "xx": ["不胜而往，咎也。", "莫夜有戎，得中道也。", "君子夬夬，终无咎也。", "其行次且，位不当也。闻言不信，聪不明也。", "中行无咎，中未光也。", "无号之凶，终不可长也。"]}, {"n": 44, "name": "姤", "nameT": "姤", "down": "巽", "up": "乾", "gc": "女壮，勿用取女。", "gcT": "女壯，勿用取女。", "yao": ["初六：系于金柅，贞吉，有攸往，见凶，羸豕，孚，蹢躅。", "九二：包有鱼，无咎，不利宾。", "九三：臀无肤，其行次且，厉，无大咎。", "九四：包无鱼，起凶。", "九五：以杞苞瓜，含章，有陨自天。", "上九：姤其角，吝，无咎。"], "yaoT": ["初六：系于金柅，貞吉，有攸往，見凶，羸豕，孚，蹢躅。", "九二：包有魚，无咎，不利賓。", "九三：臀无膚，其行次且，厲，无大咎。", "九四：包无魚，起凶。", "九五：以杞苞瓜，含章，有隕自天。", "上九：姤其角，吝，无咎。"], "tuan": "姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！", "dx": "天下有风，姤；后以施命诰四方。", "dxT": "天下有風，姤；后以施命誥四方。", "xx": ["系于金柅，柔道牵也。", "包有鱼，义不及宾也。", "其行次且，行未牵也。", "无鱼之凶，远民也。", "九五含章，中正也。有陨自天，志不舍命也。", "姤其角，上穷吝也。"]}, {"n": 45, "name": "萃", "nameT": "萃", "down": "坤", "up": "兑", "gc": "王假有庙，利见大人，亨。利贞。用大牲吉，利有攸往。", "gcT": "王假有廟，利見大人，亨。利貞。用大牲吉，利有攸往。", "yao": ["初六：有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。", "六二：引吉，无咎，孚乃利用禴。", "六三：萃如，嗟如，无攸利，往无咎，小吝。", "九四：大吉，无咎。", "九五：萃有位，无咎。匪孚，元永贞，悔亡。", "上六：赍咨涕洟，无咎。"], "yaoT": ["初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。", "六二：引吉，无咎，孚乃利用禴。", "六三：萃如，嗟如，无攸利，往无咎，小吝。", "九四：大吉，无咎。", "九五：萃有位，无咎。匪孚，元永貞，悔亡。", "上六：齎咨涕洟，无咎。"], "tuan": "萃，聚也；顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。", "dx": "泽上于地，萃；君子以除戎器，戒不虞。", "dxT": "澤上于地，萃；君子以除戎器，戒不虞。", "xx": ["乃乱乃萃，其志乱也。", "引吉无咎，中未变也。", "往无咎，上巽也。", "大吉无咎，位不当也。", "萃有位，志未光也。", "赍咨涕洟，未安上也。"]}, {"n": 46, "name": "升", "nameT": "升", "down": "巽", "up": "坤", "gc": "元亨，用见大人，勿恤，南征吉。", "gcT": "元亨，用見大人，勿恤，南征吉。", "yao": ["初六：允升，大吉。", "九二：孚乃利用禴，无咎。", "九三：升虚邑。", "六四：王用亨于岐山，吉无咎。", "六五：贞吉，升阶。", "上六：冥升，利于不息之贞。"], "yaoT": ["初六：允升，大吉。", "九二：孚乃利用禴，无咎。", "九三：升虛邑。", "六四：王用亨于岐山，吉无咎。", "六五：貞吉，升階。", "上六：冥升，利于不息之貞。"], "tuan": "柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。", "dx": "地中生木，升；君子以顺德，积小以高大。", "dxT": "地中生木，升；君子以順德，積小以高大。", "xx": ["允升大吉，上合志也。", "九二之孚，有喜也。", "升虚邑，无所疑也。", "王用亨于岐山，顺事也。", "贞吉升阶，大得志也。", "冥升在上，消不富也。"]}, {"n": 47, "name": "困", "nameT": "困", "down": "坎", "up": "兑", "gc": "亨，贞大人吉，无咎，有言不信。", "gcT": "亨，貞大人吉，无咎，有言不信。", "yao": ["初六：臀困于株木，入于幽谷，三岁不觌。", "九二：困于酒食，朱绂方来，利用亨祀，征凶，无咎。", "六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。", "九四：来徐徐，困于金车，吝，有终。", "九五：劓刖，困于赤绂，乃徐有说，利用祭祀。", "上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。"], "yaoT": ["初六：臀困于株木，入于幽谷，三歲不覿。", "九二：困于酒食，朱紱方來，利用亨祀，征凶，无咎。", "六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。", "九四：來徐徐，困于金車，吝，有終。", "九五：劓刖，困于赤紱，乃徐有說，利用祭祀。", "上六：困于葛藟，于臲卼，曰動悔。有悔，征吉。"], "tuan": "困，刚掩也。险以说，困而不失其所，亨；其唯君子乎？ 贞大人吉，以刚中也。有言不信，尚口乃穷也。", "dx": "泽无水，困；君子以致命遂志。", "dxT": "澤无水，困；君子以致命遂志。", "xx": ["入于幽谷，幽不明也。", "困于酒食，中有庆也。", "据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。", "来徐徐，志在下也。虽不当位，有与也。", "劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。", "困于葛藟，未当也。动悔，有悔，吉行也。"]}, {"n": 48, "name": "井", "nameT": "井", "down": "巽", "up": "坎", "gc": "改邑不改井，无丧无得，往来井井。汔至亦未繘井。羸其瓶，凶。", "gcT": "改邑不改井，无喪无得，往來井井。汔至亦未繘井。羸其瓶，凶。", "yao": ["初六：井泥不食，旧井无禽。", "九二：井谷射鲋，瓮敝漏。", "九三：井渫不食，为我心恻，可用汲，王明，并受其福。", "六四：井甃，无咎。", "九五：井冽，寒泉食。", "上六：井收勿幕，有孚元吉。"], "yaoT": ["初六：井泥不食，舊井无禽。", "九二：井谷射鮒，瓮敝漏。", "九三：井渫不食，為我心惻，可用汲，王明，並受其福。", "六四：井甃，无咎。", "九五：井冽，寒泉食。", "上六：井收勿幕，有孚元吉。"], "tuan": "巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。", "dx": "木上有水，井；君子以劳民劝相。", "dxT": "木上有水，井；君子以勞民勸相。", "xx": ["井泥不食，下也。旧井无禽，时舍也。", "井谷射鲋，无与也。", "井渫不食，行恻也。求王明，受福也。", "井甃无咎，修井也。", "寒泉之食，中正也。", "元吉在上，大成也。"]}, {"n": 49, "name": "革", "nameT": "革", "down": "离", "up": "兑", "gc": "已日乃孚，元亨。利贞。悔亡。", "gcT": "已日乃孚，元亨。利貞。悔亡。", "yao": ["初九：巩用黄牛之革。", "六二：已日乃革之，征吉，无咎。", "九三：征凶，贞厉，革言三就，有孚。", "九四：悔亡，有孚改命，吉。", "九五：大人虎变，未占有孚。", "上六：君子豹变，小人革面，征凶，居贞吉。"], "yaoT": ["初九：鞏用黃牛之革。", "六二：已日乃革之，征吉，无咎。", "九三：征凶，貞厲，革言三就，有孚。", "九四：悔亡，有孚改命，吉。", "九五：大人虎變，未占有孚。", "上六：君子豹變，小人革面，征凶，居貞吉。"], "tuan": "革，水火相息，二女同居，其志不相得，曰革。已日乃孚；革而信也。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时义大矣哉！", "dx": "泽中有火，革；君子以治历明时。", "dxT": "澤中有火，革；君子以治歷明時。", "xx": ["巩用黄牛，不可以有为也。", "已日革之，行有嘉也。", "革言三就，又何之矣。", "改命之吉，信志也。", "大人虎变，其文炳也。", "君子豹变，其文蔚也。小人革面，顺以从君也。"]}, {"n": 50, "name": "鼎", "nameT": "鼎", "down": "巽", "up": "离", "gc": "元吉，亨。", "gcT": "元吉，亨。", "yao": ["初六：鼎颠趾，利出否，得妾以其子，无咎。", "九二：鼎有实，我仇有疾，不我能即，吉。", "九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。", "九四：鼎折足，覆公𫗧，其形渥，凶。", "六五：鼎黄耳金铉，利贞。", "上九：鼎玉铉，大吉，无不利。"], "yaoT": ["初六：鼎顛趾，利出否，得妾以其子，无咎。", "九二：鼎有實，我仇有疾，不我能即，吉。", "九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。", "九四：鼎折足，覆公餗，其形渥，凶。", "六五：鼎黃耳金鉉，利貞。", "上九：鼎玉鉉，大吉，无不利。"], "tuan": "鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。", "dx": "木上有火，鼎；君子以正位凝命。", "dxT": "木上有火，鼎；君子以正位凝命。", "xx": ["鼎颠趾，未悖也。利出否，以从贵也。", "鼎有实，慎所之也。我仇有疾，终无尤也。", "鼎耳革，失其义也。", "覆公𫗧，信如何也。", "鼎黄耳，中以为实也。", "玉铉在上，刚柔节也。"]}, {"n": 51, "name": "震", "nameT": "震", "down": "震", "up": "震", "gc": "亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。", "gcT": "亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。", "yao": ["初九：震来虩虩，后笑言哑哑，吉。", "六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。", "六三：震苏苏，震行无眚。", "九四：震遂泥。", "六五：震往来厉，亿无丧，有事。", "上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"], "yaoT": ["初九：震來虩虩，後笑言啞啞，吉。", "六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。", "六三：震蘇蘇，震行无眚。", "九四：震遂泥。", "六五：震往來厲，億无喪，有事。", "上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。"], "tuan": "震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。", "dx": "洊雷，震；君子以恐惧修省。", "dxT": "洊雷，震；君子以恐懼修省。", "xx": ["震来虩虩，恐致福也。笑言哑哑，后有则也。", "震来厉，乘刚也。", "震苏苏，位不当也。", "震遂泥，未光也。", "震往来厉，危行也。其事在中，大无丧也。", "震索索，中未得也。虽凶无咎，畏邻戒也。"]}, {"n": 52, "name": "艮", "nameT": "艮", "down": "艮", "up": "艮", "gc": "艮其背，不获其身，行其庭，不见其人，无咎。", "gcT": "艮其背，不獲其身，行其庭，不見其人，无咎。", "yao": ["初六：艮其趾，无咎，利永贞。", "六二：艮其腓，不拯其随，其心不快。", "九三：艮其限，列其夤，厉薰心。", "六四：艮其身，无咎。", "六五：艮其辅，言有序，悔亡。", "上九：敦艮，吉。"], "yaoT": ["初六：艮其趾，无咎，利永貞。", "六二：艮其腓，不拯其隨，其心不快。", "九三：艮其限，列其夤，厲薰心。", "六四：艮其身，无咎。", "六五：艮其輔，言有序，悔亡。", "上九：敦艮，吉。"], "tuan": "艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。", "dx": "兼山，艮；君子以思不出其位。", "dxT": "兼山，艮；君子以思不出其位。", "xx": ["艮其趾，未失正也。", "不拯其随，未退听也。", "艮其限，危薰心也。", "艮其身，止诸躬也。", "艮其辅，以中正也。", "敦艮之吉，以厚终也。"]}, {"n": 53, "name": "渐", "nameT": "漸", "down": "艮", "up": "巽", "gc": "女归吉，利贞。", "gcT": "女歸吉，利貞。", "yao": ["初六：鸿渐于干，小子厉，有言，无咎。", "六二：鸿渐于磐，饮食衎衎，吉。", "九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。", "六四：鸿渐于木，或得其桷，无咎。", "九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。", "上九：鸿渐于陆，其羽可用为仪，吉。"], "yaoT": ["初六：鴻漸于干，小子厲，有言，无咎。", "六二：鴻漸于磐，飲食衎衎，吉。", "九三：鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。", "六四：鴻漸于木，或得其桷，无咎。", "九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。", "上九：鴻漸于陸，其羽可用為儀，吉。"], "tuan": "渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。", "dx": "山上有木，渐；君子以居贤德，善俗。", "dxT": "山上有木，漸；君子以居賢德，善俗。", "xx": ["小子之厉，义无咎也。", "饮食衎衎，不素饱也。", "夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。", "或得其桷，顺以巽也。", "终莫之胜，吉；得所愿也。", "其羽可用为仪，吉；不可乱也。"]}, {"n": 54, "name": "归妹", "nameT": "歸妹", "down": "兑", "up": "震", "gc": "征凶，无攸利。", "gcT": "征凶，无攸利。", "yao": ["初九：归妹以娣，跛能履，征吉。", "九二：眇能视，利幽人之贞。", "六三：归妹以须，反归以娣。", "九四：归妹愆期，迟归有时。", "六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。", "上六：女承筐无实，士刲羊无血，无攸利。"], "yaoT": ["初九：歸妹以娣，跛能履，征吉。", "九二：眇能視，利幽人之貞。", "六三：歸妹以須，反歸以娣。", "九四：歸妹愆期，遲歸有時。", "六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。", "上六：女承筐无實，士刲羊无血，无攸利。"], "tuan": "归妹，天地之大义也。天地不交，而万物不兴，归妹人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。", "dx": "泽上有雷，归妹；君子以永终知敝。", "dxT": "澤上有雷，歸妹；君子以永終知敝。", "xx": ["归妹以娣，以恒也。跛能履吉，相承也。", "利幽人之贞，未变常也。", "归妹以须，未当也。", "愆期之志，有待而行也。", "帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。", "上六无实，承虚筐也。"]}, {"n": 55, "name": "丰", "nameT": "豐", "down": "离", "up": "震", "gc": "亨。王假之，勿忧，宜日中。", "gcT": "亨。王假之，勿憂，宜日中。", "yao": ["初九：遇其配主，虽旬无咎，往有尚。", "六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。", "九三：丰其沛，日中见沬，折其右肱，无咎。", "九四：丰其蔀，日中见斗，遇其夷主，吉。", "六五：来章，有庆誉，吉。", "上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。"], "yaoT": ["初九：遇其配主，雖旬无咎，往有尚。", "六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。", "九三：豐其沛，日中見沬，折其右肱，无咎。", "九四：豐其蔀，日中見斗，遇其夷主，吉。", "六五：來章，有慶譽，吉。", "上六：豐其屋，蔀其家，窺其戶，闃其无人，三歲不觌，凶。"], "tuan": "丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？", "dx": "雷电皆至，丰；君子以折狱致刑。", "dxT": "雷電皆至，豐；君子以折獄致刑。", "xx": ["虽旬无咎，过旬灾也。", "有孚发若，信以发志也。", "丰其沛，不可大事也。折其右肱，终不可用也。", "丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。", "六五之吉，有庆也。", "丰其屋，天际翔也。窥其户，阒其无人，自藏也。"]}, {"n": 56, "name": "旅", "nameT": "旅", "down": "艮", "up": "离", "gc": "小亨，旅贞吉。", "gcT": "小亨，旅貞吉。", "yao": ["初六：旅琐琐，斯其所取灾。", "六二：旅即次，怀其资，得童仆贞。", "九三：旅焚其次，丧其童仆，贞厉。", "九四：旅于处，得其资斧，我心不快。", "六五：射雉一矢亡，终以誉命。", "上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。"], "yaoT": ["初六：旅瑣瑣，斯其所取災。", "六二：旅即次，懷其資，得童僕貞。", "九三：旅焚其次，喪其童僕，貞厲。", "九四：旅于處，得其資斧，我心不快。", "六五：射雉一矢亡，終以譽命。", "上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。"], "tuan": "旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！", "dx": "山上有火，旅；君子以明慎用刑，而不留狱。", "dxT": "山上有火，旅；君子以明慎用刑，而不留獄。", "xx": ["旅琐琐，志穷灾也。", "得童仆贞，终无尤也。", "旅焚其次，亦以伤矣。以旅与下，其义丧也。", "旅于处，未得位也。得其资斧，心未快也。", "终以誉命，上逮也。", "以旅在上，其义焚也。丧牛于易，终莫之闻也。"]}, {"n": 57, "name": "巽", "nameT": "巽", "down": "巽", "up": "巽", "gc": "小亨。利有攸往。利见大人。", "gcT": "小亨。利有攸往。利見大人。", "yao": ["初六：进退，利武人之贞。", "九二：巽在床下，用史巫纷若，吉无咎。", "九三：频巽，吝。", "六四：悔亡，田获三品。", "九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。", "上九：巽在床下，丧其资斧，贞凶。"], "yaoT": ["初六：進退，利武人之貞。", "九二：巽在牀下，用史巫紛若，吉无咎。", "九三：頻巽，吝。", "六四：悔亡，田獲三品。", "九五：貞吉悔亡，无不利。无初有終，先庚三日，後庚三日，吉。", "上九：巽在牀下，喪其資斧，貞凶。"], "tuan": "重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人。", "dx": "随风，巽；君子以申命行事。", "dxT": "隨風，巽；君子以申命行事。", "xx": ["进退，志疑也。利武人之贞，志治也。", "纷若之吉，得中也。", "频巽之吝，志穷也。", "田获三品，有功也。", "九五之吉，位正中也。", "巽在床下，上穷也。丧其资斧，正乎凶也。"]}, {"n": 58, "name": "兑", "nameT": "兌", "down": "兑", "up": "兑", "gc": "亨。利贞。", "gcT": "亨。利貞。", "yao": ["初九：和兑，吉。", "九二：孚兑，吉，悔亡。", "六三：来兑，凶。", "九四：商兑，未宁，介疾有喜。", "九五：孚于剥，有厉。", "上六：引兑。"], "yaoT": ["初九：和兌，吉。", "九二：孚兌，吉，悔亡。", "六三：來兌，凶。", "九四：商兌，未寧，介疾有喜。", "九五：孚于剝，有厲。", "上六：引兌。"], "tuan": "兑，说也。刚中而柔外，说以利贞，是以顺乎天，而应乎人。说以先民，民忘其劳；说以犯难，民忘其死；说之大，民劝矣哉！", "dx": "丽泽，兑；君子以朋友讲习。", "dxT": "麗澤，兌；君子以朋友講習。", "xx": ["和兑之吉，行未疑也。", "孚兑之吉，信志也。", "来兑之凶，位不当也。", "九四之喜，有庆也。", "孚于剥，位正当也。", "上六引兑，未光也。"]}, {"n": 59, "name": "涣", "nameT": "渙", "down": "坎", "up": "巽", "gc": "亨，王假有庙，利涉大川，利贞。", "gcT": "亨，王假有廟，利涉大川，利貞。", "yao": ["初六：用拯马壮，吉，悔亡。", "九二：涣奔其机，悔亡。", "六三：涣其躬，无悔。", "六四：涣其群，元吉。涣有丘，匪夷所思。", "九五：涣汗其大号，涣王居，无咎。", "上九：涣其血，去逖出，无咎。"], "yaoT": ["初六：用拯馬壯，吉，悔亡。", "九二：渙奔其机，悔亡。", "六三：渙其躬，无悔。", "六四：渙其群，元吉。渙有丘，匪夷所思。", "九五：渙汗其大號，渙王居，无咎。", "上九：渙其血，去逖出，无咎。"], "tuan": "涣，亨。刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。", "dx": "风行水上，涣；先王以享于帝立庙。", "dxT": "風行水上，渙；先王以享于帝立廟。", "xx": ["初六之吉，顺也。", "涣奔其机，得愿也。", "涣其躬，志在外也。", "涣其群，元吉；光大也。", "王居无咎，正位也。", "涣其血，远害也。"]}, {"n": 60, "name": "节", "nameT": "節", "down": "兑", "up": "坎", "gc": "亨。苦节不可贞。", "gcT": "亨。苦節不可貞。", "yao": ["初九：不出户庭，无咎。", "九二：不出门庭，凶。", "六三：不节若，则嗟若，无咎。", "六四：安节，亨。", "九五：甘节，吉；往有尚。", "上六：苦节，贞凶，悔亡。"], "yaoT": ["初九：不出戶庭，无咎。", "九二：不出門庭，凶。", "六三：不節若，則嗟若，无咎。", "六四：安節，亨。", "九五：甘節，吉；往有尚。", "上六：苦節，貞凶，悔亡。"], "tuan": "节，亨，刚柔分，而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。", "dx": "泽上有水，节；君子以制数度，议德行。", "dxT": "澤上有水，節；君子以制數度，議德行。", "xx": ["不出户庭，知通塞也。", "不出门庭，失时极也。", "不节之嗟，又谁咎也。", "安节之亨，承上道也。", "甘节之吉，居位中也。", "苦节贞凶，其道穷也。"]}, {"n": 61, "name": "中孚", "nameT": "中孚", "down": "兑", "up": "巽", "gc": "豚鱼吉，利涉大川，利贞。", "gcT": "豚魚吉，利涉大川，利貞。", "yao": ["初九：虞吉，有它不燕。", "九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。", "六三：得敌，或鼓或罢，或泣或歌。", "六四：月几望，马匹亡，无咎。", "九五：有孚挛如，无咎。", "上九：翰音登于天，贞凶。"], "yaoT": ["初九：虞吉，有它不燕。", "九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。", "六三：得敵，或鼓或罷，或泣或歌。", "六四：月幾望，馬匹亡，无咎。", "九五：有孚攣如，无咎。", "上九：翰音登于天，貞凶。"], "tuan": "中孚，柔在内而刚得中。说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。", "dx": "泽上有风，中孚；君子以议狱缓死。", "dxT": "澤上有風，中孚；君子以議獄緩死。", "xx": ["初九虞吉，志未变也。", "其子和之，中心愿也。", "可鼓或罢，位不当也。", "马匹亡，绝类上也。", "有孚挛如，位正当也。", "翰音登于天，何可长也。"]}, {"n": 62, "name": "小过", "nameT": "小過", "down": "艮", "up": "震", "gc": "亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。", "gcT": "亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。", "yao": ["初六：飞鸟以凶。", "六二：过其祖，遇其妣；不及其君，遇其臣；无咎。", "九三：弗过防之，从或戕之，凶。", "九四：无咎，弗过遇之。往厉必戒，勿用永贞。", "六五：密云不雨，自我西郊，公弋取彼在穴。", "上六：弗遇过之，飞鸟离之，凶，是谓灾眚。"], "yaoT": ["初六：飛鳥以凶。", "六二：過其祖，遇其妣；不及其君，遇其臣；无咎。", "九三：弗過防之，從或戕之，凶。", "九四：无咎，弗過遇之。往厲必戒，勿用永貞。", "六五：密雲不雨，自我西郊，公弋取彼在穴。", "上六：弗遇過之，飛鳥離之，凶，是謂災眚。"], "tuan": "小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，有飞鸟遗之音，不宜上宜下，大吉；上逆而下顺也。", "dx": "山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。", "dxT": "山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。", "xx": ["飞鸟以凶，不可如何也。", "不及其君，臣不可过也。", "从或戕之，凶如何也。", "弗过遇之，位不当也。往厉必戒，终不可长也。", "密云不雨，已上也。", "弗遇过之，已亢也。"]}, {"n": 63, "name": "既济", "nameT": "既濟", "down": "离", "up": "坎", "gc": "亨小。利贞。初吉终乱。", "gcT": "亨小。利貞。初吉終亂。", "yao": ["初九：曳其轮，濡其尾，无咎。", "六二：妇丧其茀，勿逐，七日得。", "九三：高宗伐鬼方，三年克之，小人勿用。", "六四：𦈡有衣袽，终日戒。", "九五：东邻杀牛，不如西邻之禴祭，实受其福。", "上六：濡其首，厉。"], "yaoT": ["初九：曳其輪，濡其尾，无咎。", "六二：婦喪其茀，勿逐，七日得。", "九三：高宗伐鬼方，三年克之，小人勿用。", "六四：繻有衣袽，終日戒。", "九五：東鄰殺牛，不如西鄰之禴祭，實受其福。", "上六：濡其首，厲。"], "tuan": "既济，亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。", "dx": "水在火上，既济；君子以思患而豫防之。", "dxT": "水在火上，既濟；君子以思患而豫防之。", "xx": ["曳其轮，义无咎也。", "七日得，以中道也。", "三年克之，惫也。", "终日戒，有所疑也。", "东邻杀牛，不如西邻之时也；实受其福，吉大来也。", "濡其首厉，何可久也。"]}, {"n": 64, "name": "未济", "nameT": "未濟", "down": "坎", "up": "离", "gc": "亨。小狐汔济，濡其尾，无攸利。", "gcT": "亨。小狐汔濟，濡其尾，无攸利。", "yao": ["初六：濡其尾，吝。", "九二：曳其轮，贞吉。", "六三：未济，征凶，利涉大川。", "九四：贞吉，悔亡，震用伐鬼方，三年有赏于大国。", "六五：贞吉，无悔，君子之光，有孚，吉。", "上九：有孚于饮酒，无咎，濡其首，有孚失是。"], "yaoT": ["初六：濡其尾，吝。", "九二：曳其輪，貞吉。", "六三：未濟，征凶，利涉大川。", "九四：貞吉，悔亡，震用伐鬼方，三年有賞于大國。", "六五：貞吉，无悔，君子之光，有孚，吉。", "上九：有孚于飲酒，无咎，濡其首，有孚失是。"], "tuan": "未济，亨；柔得中也。小狐汔济，未出中也。濡其尾，无攸利；不续终也。虽不当位，刚柔应也。", "dx": "火在水上，未济；君子以慎辨物居方。", "dxT": "火在水上，未濟；君子以慎辨物居方。", "xx": ["濡其尾，亦不知极也。", "九二贞吉，中以行正也。", "未济征凶，位不当也。", "贞吉悔亡，志行也。", "君子之光，其晖吉也。", "饮酒濡首，亦不知节也。"]}];
